services:
  - type: web
    name: gestione-turni
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestione-turni-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: gestione-turni-db
    plan: starter
