    var og = orari[day] || {fascia1:{inizio:"08:00",puntoMedio:"14:30",fine:"21:00"}, fascia2:null};
    var f1 = og.fascia1, f2 = og.fascia2;
    var campo = function(fascia, nome, valore){
      return '<input type="time" style="width:106px;border:1px solid var(--border);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 8px;font-size:.86rem;" '+
        'data-stagione-orario="'+i+'|'+day+'|'+fascia+'|'+nome+'" value="'+escapeHtml(valore)+'">';
    };
    return '<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border);flex-wrap:wrap;">'+
      '<div style="min-width:86px;font-weight:700;font-size:.84rem;">'+DAY_LABELS[day]+'</div>'+
      campo("fascia1","inizio",f1.inizio)+campo("fascia1","puntoMedio",f1.puntoMedio)+campo("fascia1","fine",f1.fine)+
      '<label class="check" style="margin-left:4px;"><input type="checkbox" data-stagione-fascia2="'+i+'|'+day+'" '+(f2?"checked":"")+'> sì</label>'+
      (f2 ? campo("fascia2","inizio",f2.inizio)+campo("fascia2","fine",f2.fine) : '')+
    '</div>';
  }).join("");
  return '<div style="margin-top:12px;">'+testa+righe+'</div>';
}

function renderDeroghe(s){
  var chiavi = Object.keys(s.deroghe||{}).sort();
  var oggi = isoDate(new Date());
  var righe = chiavi.map(function(data){
    var d = s.deroghe[data];
    var passata = data < oggi;
    var giorno = DAYS[(new Date(data+"T00:00:00").getDay()+6)%7];
    // con la data vera si parte dagli orari che quel giorno avrebbe davvero (stagione
    // compresa): partire da quelli standard riporterebbe di nascosto gli orari invernali
    // su una deroga di Ferragosto
    var base = configurazioneDelGiorno(s, giorno, data);
    var o = d.orari || base.orari;
    return '<div style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;'+(passata?"opacity:.6;":"")+'">'+
      '<div class="grid cols-3">'+
        '<div class="field">Data<div style="font-weight:700;color:var(--ink);">'+fmtDateLabel(data)+' '+(new Date(data+"T00:00:00").getFullYear())+' <span style="font-weight:400;color:var(--ink-muted);">('+DAY_LABELS[giorno]+')</span></div></div>'+
        '<label class="field">Nome<input type="text" data-deroga="'+data+'|nome" value="'+escapeHtml(d.nome||"")+'" placeholder="Ferragosto"></label>'+
        '<div class="field" style="justify-content:flex-end;"><label class="check"><input type="checkbox" data-deroga-chiuso="'+data+'" '+(d.chiuso?"checked":"")+'> Locale chiuso</label></div>'+
      '</div>'+
      (d.chiuso ? '<div class="card-desc" style="margin:8px 0 0;">Nessun turno verrà generato per questa data.</div>' :
        '<div class="grid cols-3" style="margin-top:10px;">'+
          '<label class="field">Apertura<input type="time" data-deroga-orario="'+data+'|fascia1|inizio" value="'+o.fascia1.inizio+'"></label>'+
          '<label class="field">Cambio turno<input type="time" data-deroga-orario="'+data+'|fascia1|puntoMedio" value="'+o.fascia1.puntoMedio+'"></label>'+
          '<label class="field">Chiusura<input type="time" data-deroga-orario="'+data+'|fascia1|fine" value="'+o.fascia1.fine+'"></label>'+
        '</div>'+
        '<div class="grid cols-2" style="margin-top:10px;">'+
          '<label class="field">Persone in sala<input type="number" min="0" data-deroga-staff="'+data+'|sala" value="'+((d.staff&&d.staff.sala!=null)?d.staff.sala:s.salaNormale)+'"></label>'+
          '<label class="field">Persone al banco<input type="number" min="0" data-deroga-staff="'+data+'|banco" value="'+((d.staff&&d.staff.banco!=null)?d.staff.banco:s.bancoNormale)+'"></label>'+
        '</div>')+
      '<div class="btn-row" style="margin-top:10px;">'+
        '<button class="btn btn-sm btn-danger" data-deroga-elimina="'+data+'">Rimuovi</button>'+
        (passata?'<span class="pill" style="background:var(--surface-2);color:var(--ink-muted);">data passata</span>':'')+
      '</div>'+
    '</div>';
  }).join("");
  if(!chiavi.length) righe = '<div class="empty-note" style="margin-bottom:10px;">Nessun giorno speciale impostato. Aggiungine uno dai suggerimenti qui sotto, oppure a mano per una sagra, un ponte o una chiusura.</div>';
  return righe+
    '<div class="btn-row"><input type="date" id="deroga-nuova-data" value="'+isoDate(new Date())+'"><button class="btn btn-sm" id="btn-deroga-nuova">+ Aggiungi giorno speciale</button></div>'+
    renderSuggerimentiGiorni(s);
}

/* Controlli di coerenza sulla configurazione: gli errori qui producono, una settimana
   dopo, turni assurdi che sembrano colpa dell'algoritmo. Meglio dirlo subito. */
function validaImpostazioni(s){
  var out = [];
  var durataFascia = function(inizio, fine){
    var m = timeToMin(fine) - timeToMin(inizio);
    if(m <= 0) m += 1440; // chiusura dopo la mezzanotte
    return m/60;
  };
  DAYS.forEach(function(day){
    var og = s.orariGiorni[day];
    if(!og || !og.fascia1) return;
    var f1 = og.fascia1, etichetta = DAY_LABELS[day];
    var dur1 = durataFascia(f1.inizio, f1.fine);
    if(dur1 < 0.5 || dur1 > 16){
      out.push({livello:"errore", testo:etichetta+": la fascia di apertura dura "+fmtOre(dur1)+" — probabilmente gli orari sono invertiti."});
    }
    // il cambio turno deve cadere dentro la fascia di apertura
    var pmDa = timeToMin(f1.puntoMedio) - timeToMin(f1.inizio); if(pmDa<0) pmDa += 1440;
    if(pmDa <= 0 || pmDa >= dur1*60){
      out.push({livello:"errore", testo:etichetta+": il cambio turno delle "+f1.puntoMedio+" cade fuori dall’orario di apertura ("+f1.inizio+"–"+f1.fine+")."});
    }
    if(og.fascia2){
      var f2 = og.fascia2;
      var dur2 = durataFascia(f2.inizio, f2.fine);
      if(dur2 < 0.5 || dur2 > 16){
        out.push({livello:"errore", testo:etichetta+": la seconda apertura dura "+fmtOre(dur2)+" — controlla gli orari."});
      }
      if(timeToMin(f2.inizio) < timeToMin(f1.fine) && timeToMin(f1.fine) > timeToMin(f1.inizio)){
        out.push({livello:"errore", testo:etichetta+": la seconda apertura ("+f2.inizio+") comincia prima che la prima sia chiusa ("+f1.fine+")."});
      }
    }
    if(s.cucinaSegueFasce){
      var oc = s.orariCucina[day];
      if(oc && oc.fascia1){
        var durC = durataFascia(oc.fascia1.inizio, oc.fascia1.fineCapo);
        if(durC < 0.5 || durC > 16) out.push({livello:"errore", testo:etichetta+": il turno del cuoco dura "+fmtOre(durC)+" — controlla inizio e fine."});
      }
      if(oc && oc.fascia2 && og.fascia2){
        if(timeToMin(oc.fascia2.inizio) < timeToMin(og.fascia2.inizio)){
          out.push({livello:"avviso", testo:etichetta+": la cucina della sera apre alle "+oc.fascia2.inizio+", prima del locale ("+og.fascia2.inizio+")."});
        }
      }
    }
  });
  // banco e cameriere non possono iniziare dopo il cambio turno
  DAYS.forEach(function(day){
    var og = s.orariGiorni[day];
    if(!og || !og.fascia1) return;
    if(timeToMin(s.bancoInizio) >= timeToMin(og.fascia1.puntoMedio)){
      out.push({livello:"avviso", testo:DAY_LABELS[day]+": il banco entra alle "+s.bancoInizio+", cioè dopo il cambio turno: il turno di mattina risulterebbe vuoto."});
    }
    if(timeToMin(s.camerierArrivo) >= timeToMin(og.fascia1.puntoMedio)){
      out.push({livello:"avviso", testo:DAY_LABELS[day]+": il/la cameriere/a entra alle "+s.camerierArrivo+", cioè dopo il cambio turno."});
    }
  });
  // l'anticipo di chiusura cucina non può superare il turno del cuoco
  if(!s.cucinaSegueFasce){
    var durCuoco = durataFascia(s.cuocoInizio, s.fineTurnoCuocoCapo);
    if((Number(s.minutiCucinaPrimaFineTurno)||0)/60 >= durCuoco){
      out.push({livello:"avviso", testo:"L’anticipo di chiusura cucina ("+s.minutiCucinaPrimaFineTurno+" min) è più lungo del turno del cuoco."});
    }
  }
  // il tetto giornaliero deve coprire il turno più lungo che l'azienda genera davvero,
  // altrimenti quel turno risulta irregolare ogni singolo giorno
  var piuLungo = 0, doveLungo = "";
  DAYS.forEach(function(day){
    getSlotsForDay(s, day, null).forEach(function(slot){
      if(slot.isCuoco || !slot.fine) return;
      var d = durataFascia(slot.inizio, slot.fine);
      if(d > piuLungo){ piuLungo = d; doveLungo = DAY_LABELS[day]+" · "+slot.label.toLowerCase(); }
    });
  });
  if(piuLungo > (Number(s.oreGiornaliereMax)||10) + 0.001){
    out.push({livello:"avviso", testo:"Il turno più lungo previsto ("+doveLungo+", "+fmtOre(piuLungo)+") supera il massimo di ore giornaliere ("+s.oreGiornaliereMax+" h): verrà segnalato come irregolare tutti i giorni."});
  }
  if((Number(s.salaNormale)||0)===0 && (Number(s.bancoNormale)||0)===0){
    out.push({livello:"avviso", testo:"Sala e banco sono entrambi a zero persone: la generazione produrrà solo turni di cucina."});
  }

  // le stagioni hanno orari propri: vanno controllate come quelli standard, altrimenti
  // l'errore si scopre solo il giorno in cui la stagione entra in vigore
  (s.stagioni||[]).forEach(function(st){
    if(!st) return;
    var nome = st.nome || "senza nome";
    var valida = function(v){ return /^(0\d|1[0-2])-([0-2]\d|3[01])$/.test(String(v||"")) && giornoEsiste(2004, Number(String(v).slice(0,2)), Number(String(v).slice(3,5))); };
    if(!valida(st.dal) || !valida(st.al)){
      out.push({livello:"errore", testo:"Stagione “"+nome+"”: il periodo va scritto come giorno e mese a due cifre (per esempio 06-01 → 09-15). Con “"+(st.dal||"")+" → "+(st.al||"")+"” la stagione non entrerà mai in vigore."});
      return;
    }
    if(!st.orariGiorni) return;
    DAYS.forEach(function(day){
      var og = st.orariGiorni[day];
      if(!og || !og.fascia1) return;
      var f1 = og.fascia1, dove = "Stagione “"+nome+"”, "+DAY_LABELS[day];
      if(!f1.inizio || !f1.fine || !f1.puntoMedio){
        out.push({livello:"errore", testo:dove+": manca un orario. Compila apertura, cambio turno e chiusura."});
        return;
      }
      var dur = durataFascia(f1.inizio, f1.fine);
      if(dur < 0.5 || dur > 16){
        out.push({livello:"errore", testo:dove+": l’apertura dura "+fmtOre(dur)+" — probabilmente gli orari sono invertiti."});
      }
      var pm = timeToMin(f1.puntoMedio) - timeToMin(f1.inizio); if(pm<0) pm += 1440;
      if(pm <= 0 || pm >= dur*60){
        out.push({livello:"errore", testo:dove+": il cambio turno delle "+f1.puntoMedio+" cade fuori dall’orario di apertura ("+f1.inizio+"–"+f1.fine+")."});
      }
      if(og.fascia2){
        var dur2 = durataFascia(og.fascia2.inizio, og.fascia2.fine);
        if(dur2 < 0.5 || dur2 > 16){
          out.push({livello:"errore", testo:dove+": la seconda apertura dura "+fmtOre(dur2)+" — controlla gli orari."});
        }
      }
    });
  });

  // una sera aperta senza cucina configurata non produce nessun turno cuoco e nemmeno
  // un buco da risolvere: il turno esce con sala e banco e senza nessuno ai fornelli
  if(s.cucinaSegueFasce){
    DAYS.forEach(function(day){
      var seraStandard = !!(s.orariGiorni[day] && s.orariGiorni[day].fascia2);
      var stagioniSera = (s.stagioni||[]).filter(function(st){
        return st && st.attiva!==false && st.orariGiorni && st.orariGiorni[day] && st.orariGiorni[day].fascia2;
      });
      if(!seraStandard && !stagioniSera.length) return;
      if(s.orariCucina[day] && s.orariCucina[day].fascia2) return;
      var quando = seraStandard ? "" : " (nella stagione “"+(stagioniSera[0].nome||"senza nome")+"”)";
      out.push({livello:"avviso", testo:DAY_LABELS[day]+quando+": la sera il locale è aperto ma la cucina serale non è configurata. Sala e banco verranno coperti, il cuoco no — e il turno mancante non comparirà tra i buchi da risolvere. Attivalo in “Cucina”."});
    });
  }
  return out;
}
/* Il giorno esiste davvero in quel mese? Il costruttore Date non se ne lamenta: il
   29 febbraio di un anno non bisestile diventa in silenzio il 1º marzo. */
function giornoEsiste(anno, mese, giorno){
  var d = new Date(anno, mese-1, giorno);
  return d.getFullYear()===anno && d.getMonth()===mese-1 && d.getDate()===giorno;
}
function renderValidazione(s){
  var esiti = validaImpostazioni(s);
  if(!esiti.length) return "";
  var errori = esiti.filter(function(x){ return x.livello==="errore"; });
  var avvisi = esiti.filter(function(x){ return x.livello==="avviso"; });
  var blocchi = "";
  if(errori.length){
    blocchi += '<div class="valid-banner errori"><strong>'+errori.length+' cosa/e non torna/no nella configurazione</strong> — con questi valori i turni usciranno sbagliati:'+
      '<ul>'+errori.map(function(x){ return '<li>'+escapeHtml(x.testo)+'</li>'; }).join("")+'</ul></div>';
  }
  if(avvisi.length){
    blocchi += '<div class="valid-banner avvisi"><strong>'+avvisi.length+' cosa/e da controllare</strong> — non è un errore, ma probabilmente non è quello che volevi:'+
      '<ul>'+avvisi.map(function(x){ return '<li>'+escapeHtml(x.testo)+'</li>'; }).join("")+'</ul></div>';
  }
  return blocchi;
}

function renderPrioritaFasceGrid(s){
  var rows = DAYS.map(function(day){
    var hasSera = !!(s.orariGiorni[day] && s.orariGiorni[day].fascia2);
    var cells = BANDE.map(function(banda){
      var val = Number(s.prioritaFasce[day] && s.prioritaFasce[day][banda]) || 3;
      var opts = TIER_VALUES.map(function(t){
        return '<option value="'+t+'"'+(val===t?" selected":"")+'>'+TIER_LABELS[t]+'</option>';
      }).join("");
      // la sera si configura sempre: così è già pronta il giorno in cui si apre anche
      // la sera, e non si scopre a turni generati che quella fascia non era impostata
      var inattiva = (banda==="sera" && !hasSera);
      return '<label class="field" style="min-width:130px;'+(inattiva?"opacity:.6;":"")+'">'+BANDA_LABELS[banda]+
        '<select data-priorita-fascia="'+day+'|'+banda+'">'+opts+'</select>'+
        (inattiva?'<span class="hint" style="font-size:.68rem;">nessuna apertura serale</span>':'')+
      '</label>';
    }).join("");
    return '<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);">'+
      '<div style="min-width:96px;font-weight:700;padding-top:18px;">'+DAY_LABELS[day]+'</div>'+cells+'</div>';
  }).join("");
  return '<div style="margin-top:6px;">'+rows+'</div>';
}

      ) : '<div class="card-desc" style="margin:8px 0 0;">Questo giorno non ha una seconda apertura del locale, né negli orari standard né in una stagione (vedi “Orari di apertura al pubblico” e “Stagioni”): nessun turno cucina serale possibile.</div>')+

}

function renderImpostazioni(){

    '<div class="card-desc">Quando non c’è abbastanza personale per coprire tutti i turni, decidi tu quale reparto proteggere per primo tra cucina, banco e sala, e per ogni giorno e ogni fascia (mattina, pomeriggio e sera) quanto quella fascia va difesa: <strong>alta</strong> = coperta per prima, <strong>media</strong> = subito dopo, <strong>bassa</strong> = il resto, coperto per ultimo.</div>'+

    '<div class="card-desc" style="margin-bottom:6px;">Le tue configurazioni: puoi salvare più impostazioni complete di priorità (per esempio “Estate”, “Inverno”, “Settimana della sagra”) e richiamarle quando servono. Applicarne una sovrascrive ordine dei reparti e priorità di giorno/fascia; resta comunque tutto modificabile dopo.</div>'+

    '<div class="grid cols-3">'+ordineSelects+'</div>'+

    '<div class="card-desc" style="margin-top:16px;margin-bottom:6px;">Livello di priorità per ogni giorno e fascia oraria. La fascia “Sera” si imposta sempre, anche sui giorni che oggi non hanno una seconda apertura: se e quando l’aggiungerai (vedi “Orari di apertura al pubblico”), la priorità sarà già quella giusta.</div>'+
    renderPrioritaFasceGrid(s)+
  '</div>'+

  '<div class="card"><h2>Ore massime al giorno</h2><div class="card-desc">Limite di ore in una singola giornata. Non blocca la copertura: se l’unica persona disponibile lo supera, il turno viene assegnato lo stesso e segnalato come irregolare (vedi “Regole di tutela”). Resta invece un limite invalicabile quando si allunga un turno per raggiungere le ore di contratto.</div>'+
    '<div class="grid cols-2">'+
      num("oreGiornaliereMax","Ore massime al giorno (con straordinario)")+
    '</div></div>'+

  '<div class="card"><h2>Pareggiamento straordinari</h2><div class="card-desc">Il programma ricorda quante ore di straordinario ha fatto ciascun dipendente nelle settimane passate. Quando è attivo, a parità di preferenze e disponibilità il generatore preferisce dare eventuali nuove ore di straordinario a chi ne ha accumulate di meno nella finestra scelta qui sotto (media mobile) — resta comunque una preferenza: se serve a garantire la copertura, lo straordinario viene assegnato comunque a chi è disponibile.</div>'+
    '<label class="check"><input type="checkbox" data-setting-bool="paritaStraordinariEnabled" '+(s.paritaStraordinariEnabled?"checked":"")+'> Prova a pareggiare gli straordinari tra i dipendenti</label>'+
    '<div class="grid cols-2" style="margin-top:12px;">'+

  '<div class="card"><h2>Stagioni</h2><div class="card-desc">Un intervallo di date che ogni anno sostituisce gli orari standard: sul lago l’estate e l’inverno non sono lo stesso locale. Si scrive giorno e mese (per esempio <span class="mono">06-01</span> → <span class="mono">09-15</span>); un intervallo può anche scavalcare il capodanno. Vale per tutti gli anni, non va rifatto ogni stagione.</div>'+

  '<div class="card"><h2>Regole di tutela del personale</h2><div class="card-desc">Il programma le calcola e le segnala, ma <strong>non blocca mai la copertura di un turno</strong>: se l’unica persona disponibile infrange una di queste regole, il turno viene comunque assegnato e marcato come irregolare, così puoi decidere tu se accettarlo, spostare qualcuno o chiedere più disponibilità. I valori di default seguono la normativa italiana sull’orario di lavoro.</div>'+

  '<div class="card"><h2>Orari di apertura al pubblico</h2><div class="card-desc">Orari di sala/banco per ogni giorno della settimana. Puoi configurare fino a 2 aperture al giorno (es. lun 8–16 e 19–23) per gestire i turni spezzati. La cucina ha orari propri nella card “Cucina” qui sotto.</div>'+

  '<div class="card"><h2>Cucina</h2><div class="card-desc">Un solo cuoco per turno: il capo e la riserva si alternano (la riserva copre soprattutto i giorni liberi del capo). La cucina chiude circa mezz’ora prima della fine turno del cuoco.</div>'+

    (s.cucinaSegueFasce ? (
      '<div class="grid cols-1" style="margin-top:14px;max-width:320px;">'+

      '<div class="card-desc" style="margin-top:10px;margin-bottom:0;">Con questi valori la cucina chiude alle <strong class="mono">'+addMin(s.fineTurnoCuocoCapo,-s.minutiCucinaPrimaFineTurno)+'</strong> quando è di turno il capo, e alle <strong class="mono">'+addMin(s.fineTurnoCuocoRiserva,-s.minutiCucinaPrimaFineTurno)+'</strong> quando è di turno la riserva.</div>'
    ))+
  '</div>'+

  '<div class="card"><h2>Banco e sala</h2><div class="card-desc">Il banco è presente prima dell’apertura per preparare sala e cucina; il/la cameriere/a arriva più tardi. Il cambio turno e la chiusura si configurano per ogni giorno sopra, in “Orari di apertura al pubblico”.</div>'+
    '<div class="grid cols-2">'+

    '</div>'+
    '<div class="grid cols-2" style="margin-top:14px;">'+
      num("salaNormale","Persone in sala — giorno normale")+
      num("bancoNormale","Persone al banco — giorno normale")+

  '<div class="card"><h2>Giorni di massima affluenza</h2><div class="card-desc">I giorni in cui serve più gente al mattino: qui decidi quante persone in sala e al banco, e quali giorni della settimana valgono come picco. La priorità di copertura è una cosa distinta e si imposta nella card in cima (“Priorità quando il personale non basta”): questi giorni non la cambiano da soli.</div>'+

/* ---------- PERSONALE ---------- */
function ruoloPills(e){
  var out=[];
  if(e.ruoli.cuoco_capo) out.push('<span class="pill pill-teal">Cuoco capo</span>');
  if(e.ruoli.cuoco_riserva) out.push('<span class="pill pill-teal">Cuoco riserva</span>');
  if(e.ruoli.banco) out.push('<span class="pill pill-amber">Banco</span>');
  if(e.ruoli.sala) out.push('<span class="pill pill-wine">Sala</span>');
  return out.join(" ");
}
function renderPersonale(){
  var html = '';
  if(state.isSeed){
    html += '<div class="seed-banner no-print"><span>Personale precaricato di partenza: controlla e adegua pure ore, disponibilità e ruoli alla situazione reale.</span><button class="btn btn-sm" id="btn-dismiss-seed">Ho capito</button></div>';
  }
  html += '<div class="btn-row" style="margin-bottom:16px;"><button class="btn btn-primary" id="btn-add-emp">+ Aggiungi dipendente</button></div>';

  if(editingEmpId!==null){
    html += renderEmpForm(editingEmpId);
  }

  if(!state.employees.length){
    html += '<div class="empty-note">Nessun dipendente ancora. Aggiungine uno per iniziare a generare i turni.</div>';
  } else {
    state.employees.forEach(function(e){
      if(e.id===editingEmpId) return;
      html += '<div class="emp-row"><div class="emp-head">'+
        '<div><div class="emp-name">'+escapeHtml(e.nome)+'</div><div class="emp-roles">'+ruoloPills(e)+'</div></div>'+
        '<div class="btn-row">'+
          contractTypePill(e)+
          (e.tipoContratto==="chiamata"?
            '<span class="pill pill-teal">fino a '+e.oreContratto+'+'+e.straordinario+'h</span>' :
            '<span class="pill" style="background:var(--surface-2);color:var(--ink-muted)">'+e.oreContratto+'h contratto · +'+e.straordinario+'h straord.</span>'
          )+
          '<span class="pill" style="background:var(--surface-2);color:var(--ink-muted)">pref. '+labelTurno(e.turnoPreferito)+'</span>'+
          (e.spezzatiOk?'<span class="pill pill-warning">spezzati OK</span>':'')+
          (e.fineContrattoDal?
            ('<span class="pill pill-danger">contratto terminato dal '+fmtDateLabel(e.fineContrattoDal)+'</span>'+
             '<button class="btn btn-sm" data-clear-fine-contratto="'+e.id+'">Riattiva</button>') : '')+
          '<button class="btn btn-sm" data-edit-emp="'+e.id+'">Modifica</button>'+
          '<button class="btn btn-sm btn-danger" data-del-emp="'+e.id+'">Elimina</button>'+
        '</div>'+
      '</div></div>';
    });
  }
  return html;
}
function fmtDataOra(iso){
  if(!iso) return "—";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"short"})+" alle "+
    ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function labelTurno(t){ return t==="mattina"?"mattina":t==="pomeriggio"?"pomeriggio":"indifferente"; }
function contractTypePill(e){
  if(e.tipoContratto==="part_time") return '<span class="pill pill-amber">Part time</span>';
  if(e.tipoContratto==="chiamata") return '<span class="pill pill-teal">A chiamata</span>';
  return '<span class="pill" style="background:var(--surface-2);color:var(--ink-muted)">Full time</span>';
}

  var mattinaRow = '<div style="font-size:.72rem;font-weight:700;color:var(--ink-muted)">Mattina</div>'+DAYS.map(function(d){

  var pomeriggioRow = '<div style="font-size:.72rem;font-weight:700;color:var(--ink-muted)">Pomeriggio</div>'+DAYS.map(function(d){

  var seraRow = '<div style="font-size:.72rem;font-weight:700;color:var(--ink-muted)">Sera</div>'+DAYS.map(function(d){

  }).join("");

  return '<div class="card" id="emp-form" data-emp-id="'+e.id+'"><h2>'+(isNew?"Nuovo dipendente":"Modifica dipendente")+'</h2>'+
    '<div class="grid cols-2" style="margin-top:10px;">'+
      '<label class="field">Nome<input type="text" id="ef-nome" value="'+escapeHtml(e.nome)+'" placeholder="Nome e cognome"></label>'+
      '<label class="field">Turno preferito<select id="ef-pref"><option value="indifferente"'+(e.turnoPreferito==="indifferente"?" selected":"")+'>Indifferente</option><option value="mattina"'+(e.turnoPreferito==="mattina"?" selected":"")+'>Mattina</option><option value="pomeriggio"'+(e.turnoPreferito==="pomeriggio"?" selected":"")+'>Pomeriggio</option></select></label>'+
    '</div>'+
    '<div class="grid cols-2" style="margin-top:12px;">'+
      '<label class="field">Tipo contratto<select id="ef-tipo">'+
        '<option value="fisso"'+(e.tipoContratto==="fisso"||!e.tipoContratto?" selected":"")+'>Full time</option>'+
        '<option value="part_time"'+(e.tipoContratto==="part_time"?" selected":"")+'>Part time</option>'+
        '<option value="chiamata"'+(e.tipoContratto==="chiamata"?" selected":"")+'>A chiamata</option>'+
      '</select></label>'+
      '<div class="field" style="justify-content:flex-end;font-weight:500;color:var(--ink-muted);">A chiamata: nessuna soglia minima da rispettare; viene usato solo per coprire i buchi rimasti dopo chi ha un contratto a ore fisse (full time o part time).</div>'+
    '</div>'+
    '<div class="grid cols-2" style="margin-top:12px;">'+
      '<label class="field" id="ef-ore-label">'+(e.tipoContratto==="chiamata"?"Tetto ore settimanali (facoltativo)":"Ore a contratto / settimana")+'<input type="number" min="0" id="ef-ore" value="'+e.oreContratto+'"></label>'+
      '<label class="field">Straordinario tollerato (ore/sett.)<input type="number" min="0" id="ef-straord" value="'+e.straordinario+'"></label>'+
    '</div>'+
    '<div class="grid cols-2" style="margin-top:12px;">'+
      '<label class="field">Giorni lavorativi a settimana<input type="number" min="1" max="7" id="ef-giorni" value="'+(e.giorniLavorativi||5)+'"></label>'+

    '</div>'+
    '<div class="btn-row" style="margin-top:18px;"><button class="btn btn-primary" id="btn-save-emp">Salva</button><button class="btn btn-ghost" id="btn-cancel-emp">Annulla</button></div>'+

function defaultAvail(){
  var o={}; DAYS.forEach(function(d){ o[d]={mattina:true,pomeriggio:true,sera:true}; }); return o;

/* ---------- TURNI ---------- */
function renderTurni(){
  var wk = state.weeks[currentWeek];
  var html = '<div class="week-bar no-print">'+
    '<button class="btn btn-sm" id="week-prev">← Settimana prec.</button>'+
    '<input type="date" id="week-pick" value="'+currentWeek+'">'+
    '<button class="btn btn-sm" id="week-next">Settimana succ. →</button>'+
    '<div class="spacer"></div>'+
    '<button class="btn btn-primary" id="btn-generate">'+(wk&&wk.assign?"Rigenera turni":"Genera turni")+'</button>'+
    (wk&&wk.assign?'<button class="btn btn-primary" id="btn-convalida">'+(statoSettimana(wk)==="pubblicato"?"↻ Ripubblica":"✓ Pubblica turni")+'</button><button class="btn" id="btn-print">Stampa completa</button><button class="btn" id="btn-print-planner">Esporta planner (PDF)</button>':'')+
  '</div>';

  html += '<div class="print-only-header"><h2>'+escapeHtml(state.settings.barName)+' — turni '+fmtDateLabel(currentWeek)+' – '+fmtDateLabel(addDays(currentWeek,6))+'</h2></div>';

  if(!state.employees.length){
    return html + '<div class="empty-note">Nessun dipendente configurato: vai su “Personale” per aggiungerne.</div>';
  }

  if(!wk || !wk.assign){
    return html + '<div class="empty-note">Premi “Genera turni” per calcolare la copertura della settimana.</div>';
  }

  // stato della settimana: bozza finché non viene pubblicata; le modifiche fatte dopo
  // la pubblicazione restano contate, perché è ciò che il personale ha già letto
  var stato = statoSettimana(wk);
  if(stato==="pubblicato"){
    var modDopo = wk.modificheDopoPubblicazione||0;
    html += '<div class="stato-bar '+(modDopo?"stato-modificata":"stato-pubblicata")+' hide-in-planner-print">'+
      '<span class="pill '+(modDopo?"pill-warning":"pill-success")+'">'+(modDopo?"Modificata dopo la pubblicazione":"Pubblicata")+'</span> '+
      'Turni pubblicati il <strong>'+fmtDataOra(wk.pubblicatoIl)+'</strong>'+
      (modDopo? ' — da allora sono state fatte <strong>'+modDopo+' modifiche</strong>: chi ha già letto il turno vede qualcosa di diverso. Usa “Ripubblica” quando hai finito.' : '. Il consuntivo di fine settimana si compila qui sotto.')+
    '</div>';
  } else {
    html += '<div class="stato-bar stato-bozza hide-in-planner-print">'+
      '<span class="pill" style="background:var(--surface-2);color:var(--ink-muted);">Bozza</span> '+
      'Questa settimana non è ancora stata pubblicata: puoi lavorarci liberamente. Con “Pubblica turni” la fissi, la rendi stampabile senza ambiguità e sblocchi il consuntivo di fine settimana.'+
    '</div>';
  }

  if(wk.gaps && wk.gaps.length){
    var daPrisolvere = wk.gaps.filter(function(g){ return g.livello!=="accettato"; });
    var accettati = wk.gaps.filter(function(g){ return g.livello==="accettato"; });
    if(daPrisolvere.length){
      html += '<div class="gap-banner hide-in-planner-print"><strong>'+daPrisolvere.length+' turno/i scoperto/i da risolvere</strong> — i reparti e i giorni di priorità (vedi Impostazioni → Priorità) vengono coperti per primi. Qui non è rimasto nessuno che potesse coprirli:<ul>'+
        daPrisolvere.map(function(g){
          return '<li>'+(g.livello==="critico"?"🔴 ":"🟠 ")+escapeHtml(g.msg)+
            (g.perche?'<div style="opacity:.85;font-size:.94em;margin-top:1px;">'+escapeHtml(g.perche)+'</div>':'')+'</li>';
        }).join("")+'</ul></div>';
    }
    if(accettati.length){
      html += '<div class="card hide-in-planner-print" style="background:var(--surface-2);border-style:dashed;"><h2 style="font-size:.95rem;">'+accettati.length+' turno/i lasciati scoperti nei giorni non di punta</h2>'+
        '<div class="card-desc" style="margin-bottom:8px;">Per le priorità impostate, sui giorni non di punta si accetta di scoprire il reparto a più bassa priorità pur di garantire gli altri:</div>'+
        '<ul style="margin:0;padding-left:18px;font-size:.84rem;color:var(--ink-muted);">'+accettati.map(function(g){
          return '<li>'+escapeHtml(g.msg)+(g.perche?' — '+escapeHtml(g.perche):'')+'</li>';
        }).join("")+'</ul></div>';
    }
  }

  var irregolari = turniIrregolari(wk);
  if(irregolari.length){
    var daAccettare = irregolari.filter(function(t){ return !t.entry.accettata; });
    html += '<div class="irr-banner hide-in-planner-print">'+
      '<div class="irr-head"><strong>'+irregolari.length+' turno/i irregolare/i</strong>'+
        (daAccettare.length ? '<button class="btn btn-sm" id="btn-accetta-tutti">Accetta tutti</button>' : '<span class="pill pill-success">tutti accettati</span>')+
      '</div>'+
      '<div class="irr-desc">Il turno è stato assegnato lo stesso per non lasciare scoperto il servizio, ma infrange una regola di tutela. Valuta se accettarlo, spostare qualcuno o chiedere più disponibilità: finché non sono tutti accettati la settimana non si può convalidare.</div>'+
      '<ul class="irr-list">'+irregolari.slice(0,10).map(function(t){
        var nome = empName(t.entry.empId);
        return '<li>'+
          '<span class="irr-when">'+DAY_LABELS[t.day]+' · '+(SLOT_LABELS[t.key]||t.key)+'</span> '+
          '<strong>'+escapeHtml(nome)+'</strong> — '+escapeHtml(testoViolazioni(t.entry.violazioni))+
          (t.entry.forzato ? ' <span class="pill pill-warning">forzato a mano</span>' : '')+
          (t.entry.accettata
            ? ' <span class="pill pill-success">accettato</span>'
            : ' <button class="btn btn-sm" data-accetta-irr="'+t.day+'|'+t.key+'|'+t.idx+'">Accetta</button>')+
        '</li>';
      }).join("")+'</ul>'+
      (irregolari.length>10
        ? '<div class="irr-desc" style="margin-top:6px;">…e altri '+(irregolari.length-10)+' turni segnalati: li trovi contrassegnati nella griglia qui sotto. Se sono così tanti, di solito il problema è una configurazione — controlla il limite di ore giornaliere e gli orari di apertura.</div>'
        : '')+
      '</div>';
  }

  html += '<div class="card-desc no-print" style="margin:-6px 0 10px;">I menu a tendina permettono di assegnare manualmente chiunque, anche chi non risponde ai criteri normali (contrassegnato “fuori ruolo”). La generazione automatica continua invece a rispettare sempre tutte le regole.</div>';
  html += '<div class="table-wrap"><table class="sched-table"><thead><tr><th></th>'+
    DAYS.map(function(d){
      var picco = state.settings.giorniPicco[d];
      var dataGiorno = addDays(currentWeek, DAYS.indexOf(d));
      var cfgGiorno = configurazioneDelGiorno(state.settings, d, dataGiorno);
      var etichettaSpeciale = cfgGiorno.chiuso
        ? ' <span class="pill pill-danger" style="margin-left:4px;">chiuso</span>'
        : (cfgGiorno.etichetta ? ' <span class="pill pill-teal" style="margin-left:4px;">'+escapeHtml(cfgGiorno.etichetta)+'</span>' : '');
      return '<th>'+DAY_LABELS[d]+(picco?' <span class="pill pill-warning" style="margin-left:4px;">picco</span>':'')+etichettaSpeciale+'<div style="font-weight:400;text-transform:none;font-size:.7rem;">'+fmtDateLabel(dataGiorno)+'</div></th>';
    }).join("")+
  '</tr></thead><tbody>';

  computeSlotOrder(state.settings, currentWeek).forEach(function(slotKey){
    html += '<tr><td class="role-col">'+SLOT_LABELS[slotKey]+'</td>';
    DAYS.forEach(function(day){
      html += '<td class="slot-cell">'+renderSlotCell(day, slotKey, wk)+'</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  html += renderOreSettimanali(wk, currentWeek);
  html += renderConsuntivo(wk, currentWeek);
  html += renderStorico(wk);
  return html;
}

function eligibleForSlotKey(slotKey){
  if(slotKey==="cuoco"||slotKey==="cuoco_sera") return function(e){ return e.ruoli.cuoco_capo||e.ruoli.cuoco_riserva; };
  if(slotKey.indexOf("banco")===0) return function(e){ return e.ruoli.banco; };
  return function(e){ return e.ruoli.sala; };
}
function roleClassFor(slotKey){
  if(slotKey==="cuoco"||slotKey==="cuoco_sera") return "";
  if(slotKey.indexOf("banco")===0) return "role-banco";
  return "role-sala";
}

function buildOverrideOptions(filter, selectedId){
  var eligibleOpts = state.employees.filter(filter);
  var otherOpts = state.employees.filter(function(e){ return !filter(e); });
  var html = '<optgroup label="Idonei per questo turno">'+eligibleOpts.map(function(e){
    return '<option value="'+e.id+'"'+(e.id===selectedId?" selected":"")+'>'+escapeHtml(e.nome)+'</option>';
  }).join("")+'</optgroup>';
  if(otherOpts.length){
    html += '<optgroup label="Altri dipendenti (fuori criteri — solo manuale)">'+otherOpts.map(function(e){
      return '<option value="'+e.id+'"'+(e.id===selectedId?" selected":"")+'>'+escapeHtml(e.nome)+'</option>';
    }).join("")+'</optgroup>';
  }
  return {html:html, isOutOfCriteria: !!selectedId && eligibleOpts.every(function(e){return e.id!==selectedId;})};
}

/* marcatore del turno irregolare dentro la cella: dice quale regola e di quanto */
function badgeIrregolare(a){
  if(!a || !a.violazioni || !a.violazioni.length) return "";
  var testo = testoViolazioni(a.violazioni);
  if(a.accettata){
    return '<span class="slot-warn ok" title="'+escapeHtml(testo)+'">✓ eccezione accettata</span>';
  }
  return '<span class="slot-warn" title="'+escapeHtml(testo)+'">⚠ '+escapeHtml(a.violazioni.map(function(v){ return REGOLE_LABELS[v.regola]||v.regola; }).join(" · "))+'</span>';
}
function renderSlotCell(day, slotKey, wk){
  var filter = eligibleForSlotKey(slotKey);
  if(slotKey==="cuoco"||slotKey==="cuoco_sera"){
    var assignField = slotKey==="cuoco" ? "cuoco" : "cuocoSera";
    var c = wk.assign[day][assignField];
    var slotDefK = getSlotsForDay(state.settings, day, addDays(currentWeek, DAYS.indexOf(day))).find(function(s){ return s.key===slotKey; });
    if(!slotDefK && !c){
      return '<div class="assenza-cell-terminato" style="padding:8px 0;">—</div>';
    }
    var ov = buildOverrideOptions(filter, c?c.empId:null);
    var opts = ov.html + '<option value=""'+(!c?" selected":"")+'>— nessuno —</option>';
    var irrC = (c && c.violazioni && c.violazioni.length) ? " slot-person-irregolare" : "";
    return '<div class="slot-people"><div class="slot-person'+(c?irrC:" slot-person-empty")+'">'+
      '<select data-override="'+day+'|'+slotKey+'|0">'+opts+'</select>'+
      (ov.isOutOfCriteria?'<span class="pill pill-warning" style="margin-top:2px;">fuori ruolo</span>':'')+
      (c?'<div class="ptime mono">'+fmtIntervallo(c.inizio,c.fine)+' · cucina fino '+isoTime(c.chiusuraCucina)+'</div>':'<div class="ptime mono" style="color:var(--danger);">nessun cuoco</div>')+
      badgeIrregolare(c)+
      '</div></div>';
  }
  var slotDef = getSlotsForDay(state.settings, day, addDays(currentWeek, DAYS.indexOf(day))).find(function(s){ return s.key===slotKey; });
  var arr = wk.assign[day][slotKey] || [];
  if(!slotDef && !arr.length){
    return '<div class="assenza-cell-terminato" style="padding:8px 0;">—</div>';
  }
  var needed = slotDef ? Number(slotDef.count)||0 : 0;
  var rowsCount = Math.max(arr.length, needed); // se needed=0 e nessuno assegnato: cella vuota, nulla da mostrare
  var rc = roleClassFor(slotKey);
  var rows = [];
  for(var i=0;i<rowsCount;i++){
    var a = arr[i] || null;
    var ov = buildOverrideOptions(filter, a?a.empId:null);
    var opts = ov.html + '<option value=""'+(!a?" selected":"")+'>— nessuno —</option>';
    var defInizio = slotDef?slotDef.inizio:"";
    var defFine = slotDef?slotDef.fine:"";
    var irrA = (a && a.violazioni && a.violazioni.length) ? " slot-person-irregolare" : "";
    rows.push('<div class="slot-person '+(a?rc+irrA:"slot-person-empty")+'"><select data-override="'+day+'|'+slotKey+'|'+i+'" data-default-inizio="'+defInizio+'" data-default-fine="'+defFine+'">'+opts+'</select>'+
      (ov.isOutOfCriteria?'<span class="pill pill-warning" style="margin-top:2px;">fuori ruolo</span>':'')+
      (a?'<div class="ptime mono">'+fmtIntervallo(a.inizio,a.fine)+'</div>':'<div class="ptime mono" style="color:var(--danger);">scoperto</div>')+
      badgeIrregolare(a)+
      '</div>');
  }
  // fabbisogno a zero e nessuno assegnato: la postazione non serve quel giorno,
  // non è "scoperta" — mostrarla in rosso sarebbe un falso allarme
  if(!rows.length) return '<div class="assenza-cell-terminato" style="padding:8px 0;">—</div>';
  return '<div class="slot-people">'+rows.join("")+'</div>';
}

/* Consuntivo: cosa è stato davvero lavorato. Si compila a settimana pubblicata, perché
   prima di allora i turni cambiano ancora. È la base su cui gli straordinari smettono
   di essere una stima. */
function renderConsuntivo(wk, weekStart){
  if(statoSettimana(wk)!=="pubblicato") return "";
  var cons = statoConsuntivo(wk);
  var righe = [];
  DAYS.forEach(function(day, idx){
    var g = wk.assign[day];
    if(!g) return;
    var dataGiorno = addDays(weekStart, idx);
    Object.keys(g).forEach(function(key){
      var v = g[key];
      if(!v) return;
      var lista = (key==="cuoco"||key==="cuocoSera") ? (v.empId?[v]:[]) : (Array.isArray(v)?v:[]);
      lista.forEach(function(a, i){
        if(!a || !a.empId || !a.inizio || !a.fine) return;
        var rif = day+"|"+key+"|"+((key==="cuoco"||key==="cuocoSera")?0:i);
        var cInizio = a.consuntivo ? a.consuntivo.inizio : a.inizio;
        var cFine = a.consuntivo ? a.consuntivo.fine : a.fine;
        var scost = Math.round((durH(cInizio,cFine) - durH(a.inizio,a.fine))*100)/100;
        righe.push('<tr>'+
          '<td>'+DAY_LABELS[day]+' <span class="mono" style="color:var(--ink-muted);font-size:.78rem;">'+fmtDateLabel(dataGiorno)+'</span></td>'+
          '<td>'+(SLOT_LABELS[key]||key)+'</td>'+
          '<td>'+escapeHtml(empName(a.empId))+'</td>'+
          '<td class="mono">'+fmtIntervallo(a.inizio,a.fine)+'</td>'+
          '<td><input type="time" data-cons="'+rif+'|inizio" value="'+isoTime(cInizio)+'" style="width:96px;"> '+
              '<input type="time" data-cons="'+rif+'|fine" value="'+isoTime(cFine)+'" style="width:96px;"></td>'+
          '<td>'+(a.consuntivo
            ? '<span class="pill pill-success">confermato</span>'+(Math.abs(scost)>0.01?' <span class="mono" style="font-size:.76rem;color:var(--ink-muted);">'+(scost>0?"+":"")+scost.toFixed(2)+' h</span>':'')
            : '<button class="btn btn-sm" data-cons-conferma="'+rif+'">Conferma</button>')+'</td>'+
        '</tr>');
      });
    });
  });
  if(!righe.length) return "";
  return '<div class="card hide-in-planner-print" style="margin-top:18px;"><h2>Consuntivo della settimana</h2>'+
    '<div class="card-desc">Cosa è stato <strong>davvero</strong> lavorato, che non è sempre quello che era stato pianificato. Correggi gli orari dove il servizio è andato diversamente e conferma: da qui in poi il monte ore e il pareggiamento degli straordinari usano questi numeri invece delle previsioni. '+
      (cons.completo ? '<span class="pill pill-success">settimana completa</span>' : '<strong>'+cons.confermate+' turni confermati su '+cons.totali+'</strong>')+'</div>'+
    '<div class="btn-row" style="margin-bottom:12px;">'+
      '<button class="btn btn-primary btn-sm" id="btn-cons-tutto">Conferma tutto come pianificato</button>'+
      (cons.confermate ? '<button class="btn btn-sm" id="btn-cons-azzera">Annulla il consuntivo</button>' : '')+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Giorno</th><th>Postazione</th><th>Persona</th><th>Pianificato</th><th>Effettivo</th><th>Stato</th></tr></thead><tbody>'+righe.join("")+'</tbody></table></div></div>';
}

/* Storico: chi ha cambiato cosa e quando. È quello che manca il giorno in cui un
   dipendente contesta il turno di tre settimane fa. */
function renderStorico(wk){
  if(!wk.storico || !wk.storico.length) return "";
  var voci = wk.storico.slice().reverse().slice(0,25).map(function(s){
    return '<li><span class="mono" style="color:var(--ink-muted);font-size:.78rem;">'+fmtDataOra(s.quando)+'</span> — '+escapeHtml(s.testo)+'</li>';
  }).join("");
  return '<div class="card hide-in-planner-print" style="margin-top:18px;"><h2>Storico della settimana</h2>'+
    '<div class="card-desc">Ogni modifica lascia una traccia: serve a ricostruire cosa era stato comunicato e cosa è cambiato dopo.</div>'+
    '<ul style="margin:0;padding-left:18px;font-size:.86rem;color:var(--ink-muted);">'+voci+'</ul>'+
    (wk.storico.length>25 ? '<div class="card-desc" style="margin:8px 0 0;">Mostrate le ultime 25 di '+wk.storico.length+' voci.</div>' : '')+
  '</div>';
}

function renderOreSettimanali(wk, weekStart){
  var rollingOT = state.settings.paritaStraordinariEnabled ? rollingOvertimeMap(weekStart) : null;
  var cons = statoConsuntivo(wk);
  var rows = state.employees.map(function(e){
    var h = oreDellaSettimana(wk, e.id);
    var pian = orePianificateSettimana(wk, e.id);
    var contratto = Number(e.oreContratto)||0;
    var target = obiettivoSettimanale(e, weekStart);   // ridotto dalle assenze della settimana
    var ass = assenzeDellaSettimana(e, weekStart);
    var tol = Number(e.straordinario)||0, ceil = target+tol;
    var isChiamata = e.tipoContratto==="chiamata";
    var stato, cls, barColor;
    if(isChiamata){
      if(ceil>0 && h > ceil+0.01){ stato="Oltre il tetto"; cls="pill-danger"; barColor="var(--danger)"; }
      else if(h>0.01){ stato="A chiamata"; cls="pill-teal"; barColor="var(--teal)"; }
      else { stato="Non impiegato"; cls=""; barColor="var(--border)"; }
    } else {
      if(h > ceil+0.01){ stato="Oltre tolleranza"; cls="pill-danger"; barColor="var(--danger)"; }
      else if(h > target+0.01){ stato="Straordinario"; cls="pill-warning"; barColor="var(--warning)"; }
      else if(h < target-0.01){ stato="Sotto contratto"; cls="pill-warning"; barColor="var(--warning)"; }
      else { stato="In linea"; cls="pill-success"; barColor="var(--success)"; }
    }
    var pct = ceil>0 ? Math.max(0,Math.min(100,(h/ceil)*100)) : (h>0?100:0);
    var scostamento = Math.round((h-pian)*100)/100;
    var oreCell = '<div class="mono" style="font-weight:700;">'+h.toFixed(1)+' h</div>'+
      (Math.abs(scostamento)>0.01 ? '<div class="mono" style="font-size:.72rem;color:var(--ink-muted);">pianificate '+pian.toFixed(1)+' h ('+(scostamento>0?"+":"")+scostamento.toFixed(1)+')</div>' : '')+
      '<div style="height:6px;width:96px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:5px;"><div style="height:100%;width:'+pct.toFixed(0)+'%;background:'+barColor+';"></div></div>';
    var contrattoCell;
    if(isChiamata){
      contrattoCell = '<span style="font-style:italic;color:var(--ink-muted);">a chiamata</span>';
    } else if(target < contratto - 0.01){
      contrattoCell = target.toFixed(1)+' h<div style="font-size:.72rem;color:var(--ink-muted);white-space:normal;">'+contratto+' h meno '+
        (ass.giorniInteri ? ass.giorniInteri+' giorno/i di assenza' : '')+
        (ass.giorniInteri && ass.oreRol ? ' e ' : '')+
        (ass.oreRol ? fmtOre(ass.oreRol)+' di ROL' : '')+'</div>';
    } else {
      contrattoCell = target+' h';
    }
    var straordCell = isChiamata ? (ceil>0? 'tetto '+ceil.toFixed(0)+' h' : 'nessun tetto') : '+'+tol+' h';
    var rollCell = '';
    if(rollingOT){
      var ro = rollingOT[e.id]||0;
      rollCell = '<td class="mono">'+(ro>0.01?('<span class="pill pill-warning">'+ro.toFixed(1)+' h</span>'):'<span style="color:var(--ink-muted);">0 h</span>')+'</td>';
    }
    return '<tr><td>'+escapeHtml(e.nome)+'</td><td>'+oreCell+'</td><td class="mono">'+contrattoCell+'</td><td class="mono">'+straordCell+'</td>'+rollCell+'<td>'+(cls?'<span class="pill '+cls+'">'+stato+'</span>':'<span class="pill" style="background:var(--surface-2);color:var(--ink-muted);">'+stato+'</span>')+'</td></tr>';
  }).join("");
  var rollHeader = rollingOT ? '<th>Straord. ultime '+(Number(state.settings.paritaStraordinariFinestra)||4)+' sett.</th>' : '';
  var intestazioneOre = cons.confermate ? "Ore effettive" : "Ore assegnate";
  var nota = cons.confermate
    ? ' Le ore mostrate sono quelle <strong>effettivamente lavorate</strong> ('+cons.confermate+' turni su '+cons.totali+' confermati a consuntivo); dove il consuntivo manca vale il pianificato.'
    : ' Sono ore <strong>pianificate</strong>: diventano effettive quando confermi il consuntivo a fine servizio.';
  return '<div class="card hide-in-planner-print" style="margin-top:18px;"><h2>Ore rispetto al contratto</h2><div class="card-desc">A colpo d’occhio: quante ore fa ciascuno questa settimana rispetto alle ore concordate'+(rollingOT?', e quanto straordinario ha già accumulato di recente (usato per il pareggiamento — vedi Impostazioni)':'')+'.'+nota+' Chi ha ferie, malattia o ROL nella settimana ha l’obiettivo ridotto in proporzione.</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Dipendente</th><th>'+intestazioneOre+'</th><th>Obiettivo settimana</th><th>Straord./tetto</th>'+rollHeader+'<th>Stato</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---------- ASSENZE (ferie, malattie, ROL, fine contratto) ---------- */
function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function monthBounds(monthStr){
  var y = Number(monthStr.slice(0,4)), m = Number(monthStr.slice(5,7));
  var first = new Date(y, m-1, 1);
  var last = new Date(y, m, 0);
  return {first: isoDate(first), last: isoDate(last), daysInMonth: last.getDate(), year:y, month:m};
}
function daysOfMonth(monthStr){
  var b = monthBounds(monthStr);
  var out = [];
  for(var d=1; d<=b.daysInMonth; d++){ out.push(isoDate(new Date(b.year, b.month-1, d))); }
  return out;
}
function weekdayShortForDate(dateStr){
  var map = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
  return map[new Date(dateStr+"T00:00:00").getDay()];
}
function shiftMonth(monthStr, delta){
  var y = Number(monthStr.slice(0,4)), m = Number(monthStr.slice(5,7));
  var d = new Date(y, m-1+delta, 1);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);
}
function computeAssenzeSummary(dalStr, alStr){
  return state.employees.map(function(e){
    var ferie=0, malattia=0, rolOre=0;
    var assenze = e.assenze || {};
    Object.keys(assenze).forEach(function(d){
      if(d < dalStr || d > alStr) return;
      var rec = assenze[d];
      if(rec.tipo==="ferie") ferie++;
      else if(rec.tipo==="malattia") malattia++;
      else if(rec.tipo==="rol") rolOre += Number(rec.ore)||0;
    });
    return {emp:e, ferie:ferie, malattia:malattia, rolOre:rolOre};
  });
}
function renderAssenzaCell(emp, dateStr){
  if(emp.fineContrattoDal && dateStr > emp.fineContrattoDal){
    return '<div class="assenza-cell-terminato" title="Contratto terminato dal '+fmtDateLabel(emp.fineContrattoDal)+'">—</div>';
  }
  var isFineContrattoDay = emp.fineContrattoDal === dateStr;
  var rec = (emp.assenze && emp.assenze[dateStr]) || null;
  var tipo = isFineContrattoDay ? "fine_contratto" : (rec ? rec.tipo : "");
  var opts = [
    '<option value=""'+(!tipo?" selected":"")+'>—</option>',
    '<option value="ferie"'+(tipo==="ferie"?" selected":"")+'>Ferie</option>',
    '<option value="malattia"'+(tipo==="malattia"?" selected":"")+'>Malattia</option>',
    '<option value="rol"'+(tipo==="rol"?" selected":"")+'>ROL</option>',
    '<option value="fine_contratto"'+(tipo==="fine_contratto"?" selected":"")+'>Fine contratto da qui</option>'
  ].join("");
  var cls = "assenza-cell"+(tipo?(" assenza-"+tipo):"");
  var oreInput = tipo==="rol" ? '<input type="number" min="0" step="0.5" class="assenza-ore" data-assenza-ore="'+emp.id+'|'+dateStr+'" value="'+((rec&&rec.ore)||0)+'" title="Ore ROL">' : '';
  return '<div class="'+cls+'"><select data-assenza-cell="'+emp.id+'|'+dateStr+'">'+opts+'</select>'+oreInput+'</div>';
}
function renderAssenzeRiepilogoRows(dal, al){
  return computeAssenzeSummary(dal, al).map(function(r){
    return '<tr><td>'+escapeHtml(r.emp.nome)+'</td><td class="mono">'+r.ferie+'</td><td class="mono">'+r.malattia+'</td><td class="mono">'+(r.rolOre?r.rolOre.toFixed(1):"0")+' h</td>'+
      (r.emp.fineContrattoDal ? '<td><span class="pill pill-danger">dal '+fmtDateLabel(r.emp.fineContrattoDal)+'</span></td>' : '<td>—</td>')+
    '</tr>';

function renderAssenze(){
  if(!state.employees.length){
    return '<div class="empty-note">Nessun dipendente configurato: vai su “Personale” per aggiungerne.</div>';
  }
  var monthStr = currentAssenzeMonth;
  var bounds = monthBounds(monthStr);
  var days = daysOfMonth(monthStr);
  var monthLabel = capitalize(new Date(bounds.year, bounds.month-1, 1).toLocaleDateString("it-IT",{month:"long",year:"numeric"}));

  var html = '<div class="week-bar no-print">'+
    '<button class="btn btn-sm" id="assenze-mese-prev">← Mese prec.</button>'+
    '<input type="month" id="assenze-mese-pick" value="'+monthStr+'">'+
    '<button class="btn btn-sm" id="assenze-mese-next">Mese succ. →</button>'+
  '</div>';

  html += '<div class="card"><h2>Ferie, malattie, ROL e fine contratto — '+monthLabel+'</h2>'+
    '<div class="card-desc">Clicca su una casella per segnare ferie, malattia, ROL (indicando le ore) o la fine del contratto per quel dipendente da quel giorno in poi. Un giorno segnato come ferie, malattia o ROL esclude automaticamente quel dipendente dalla generazione automatica dei turni per quel giorno (resta possibile assegnarlo comunque a mano dalla scheda Turni, se necessario); dopo la fine contratto il dipendente non viene più conteggiato nei turni.</div>'+
    '<div class="table-wrap"><table class="assenze-table"><thead><tr><th class="assenze-name-col">Dipendente</th>'+
      days.map(function(d){
        var dow = new Date(d+"T00:00:00").getDay();
        var isWknd = dow===0 || dow===6;
        return '<th class="'+(isWknd?"assenze-col-weekend":"")+'">'+Number(d.slice(8,10))+'<div style="font-weight:400;text-transform:none;font-size:.62rem;">'+weekdayShortForDate(d)+'</div></th>';
      }).join("")+
    '</tr></thead><tbody>'+
    state.employees.map(function(e){
      return '<tr><td class="assenze-name-col">'+escapeHtml(e.nome)+'</td>'+
        days.map(function(d){
          var dow = new Date(d+"T00:00:00").getDay();
          var isWknd = dow===0 || dow===6;
          return '<td class="assenza-td'+(isWknd?" assenze-col-weekend":"")+'">'+renderAssenzaCell(e,d)+'</td>';
        }).join("")+
      '</tr>';
    }).join("")+

  html += renderAssenzeRiepilogo(bounds);

function escapeFileName(s){ return String(s||"attivita").replace(/[^a-z0-9]+/gi,"_").replace(/^_+|_+$/g,"")||"attivita"; }
function exportAssenzeExcel(dal, al){
  if(typeof XLSX === "undefined"){ alert("Libreria di esportazione non disponibile al momento (serve una connessione a internet per caricarla). Riprova tra poco."); return; }
  var aoa = [["Dipendente","Ferie (giorni)","Malattia (giorni)","ROL (ore)","Fine contratto"]];
  computeAssenzeSummary(dal, al).forEach(function(r){
    aoa.push([r.emp.nome, r.ferie, r.malattia, r.rolOre, r.emp.fineContrattoDal ? fmtDateLabel(r.emp.fineContrattoDal) : ""]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);

/* ---------- eventi ---------- */
/* Il logo viaggia dentro lo stato del locale, che è un unico blob JSON salvato a ogni
   modifica: un file da 3 MB verrebbe rispedito al server a ogni clic. Quindi si
   ridimensiona prima di salvarlo. Gli SVG non si rasterizzano (perderebbero qualità):
   si accettano solo se già leggeri. */
var LOGO_LATO_MAX = 400;      // px sul lato lungo
var LOGO_BYTE_MAX = 4*1024*1024;
var LOGO_SVG_BYTE_MAX = 120*1024;
function esitoLogo(testo, errore){
  var box = document.getElementById("logo-esito");
  if(!box) return;
  box.textContent = testo;
  box.style.color = errore ? "var(--danger)" : "var(--ink-muted)";
}
function caricaLogo(file){
  if(file.size > LOGO_BYTE_MAX){
    esitoLogo("Il file pesa "+Math.round(file.size/1048576*10)/10+" MB: il limite è 4 MB. Riduci l’immagine e riprova.", true);
    return;
  }
  var lettore = new FileReader();
  lettore.onerror = function(){ esitoLogo("Non è stato possibile leggere il file.", true); };
  lettore.onload = function(){
    var dataUri = String(lettore.result);
    if(file.type === "image/svg+xml"){
      if(dataUri.length > LOGO_SVG_BYTE_MAX*1.4){
        esitoLogo("Questo SVG è troppo pesante per essere salvato insieme ai dati. Esportalo in PNG e ricaricalo.", true);
        return;
      }
      state.settings.azienda.logo = dataUri;
      saveState(); render();
      return;
    }
    var img = new Image();
    img.onerror = function(){ esitoLogo("Il file non sembra un’immagine valida.", true); };
    img.onload = function(){
      var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if(!w || !h){ esitoLogo("Il file non sembra un’immagine valida.", true); return; }
      var scala = Math.min(1, LOGO_LATO_MAX/Math.max(w,h));
      var cw = Math.max(1, Math.round(w*scala)), ch = Math.max(1, Math.round(h*scala));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, cw, ch);
      var ridotto;
      try{
        ridotto = canvas.toDataURL("image/png");
        // un PNG molto dettagliato può restare enorme: in quel caso si passa a JPEG, che
        // però non ha trasparenza — senza fondo bianco un logo trasparente diventerebbe
        // un rettangolo nero in cima a ogni schermata e a ogni stampa
        if(ridotto.length > 260000){
          var piano = document.createElement("canvas");
          piano.width = cw; piano.height = ch;
          var pctx = piano.getContext("2d");
          pctx.fillStyle = "#ffffff";
          pctx.fillRect(0, 0, cw, ch);
          pctx.drawImage(img, 0, 0, cw, ch);
          ridotto = piano.toDataURL("image/jpeg", 0.85);
        }
      }catch(e){
        esitoLogo("Il browser non è riuscito a elaborare l’immagine.", true);
        return;
      }
      state.settings.azienda.logo = ridotto;
      saveState(); render();
      esitoLogo("Logo aggiornato ("+cw+"×"+ch+" px).");
    };
    img.src = dataUri;
  };
  lettore.readAsDataURL(file);
}

      // sta per succedere. Se il responsabile conferma, resta la traccia della forzatura.
      var forzatura = null;
      if(newVal){
        var ctrl = controlliManuali(day, slotKey, newVal, wk, currentWeek);
        var avvisi = ctrl.dure.concat(ctrl.morbide.map(function(v){ return v.testo; }));
        if(avvisi.length){
          var testo = "Attenzione:\n\n• "+avvisi.join("\n• ")+"\n\nVuoi assegnare comunque questo turno?";
          if(!confirm(testo)){ render(); return; }
          forzatura = {quando:new Date().toISOString(), motivi:avvisi};
        }
      }
      if(slotKey==="cuoco"||slotKey==="cuoco_sera"){
        var settings = state.settings;
        var assignField = slotKey==="cuoco" ? "cuoco" : "cuocoSera";
        if(!newVal){ wk.assign[day][assignField] = null; }
        else {
          var e = empById(newVal);
          var tipo = e.ruoli.cuoco_capo ? "capo" : "riserva";
          var orari = cucinaOrari(settings, day, slotKey==="cuoco"?"fascia1":"fascia2");
          var inizioHHMM = (orari && orari.inizio) || settings.cuocoInizio;
          var fineHHMM = tipo==="capo" ? ((orari&&orari.fineCapo)||settings.fineTurnoCuocoCapo) : ((orari&&orari.fineRiserva)||settings.fineTurnoCuocoRiserva);
          var inizio = isoAt(dataGiorno, inizioHHMM);
          var fine = isoFine(dataGiorno, inizioHHMM, fineHHMM);
          var chiusuraCucina = addMinIso(fine, -settings.minutiCucinaPrimaFineTurno);
          wk.assign[day][assignField] = timbra({empId:newVal, tipo:tipo, inizio:inizio, fine:fine, chiusuraCucina:chiusuraCucina}, "manuale");
          if(forzatura) wk.assign[day][assignField].forzato = forzatura;
        }
      } else {
        var list = wk.assign[day][slotKey] = wk.assign[day][slotKey] || [];
        if(newVal){
          if(list[idx]){
            list[idx].empId = newVal;
            delete list[idx].consuntivo; // il consuntivo era di un'altra persona
            timbra(list[idx], "manuale");
            if(forzatura) list[idx].forzato = forzatura; else delete list[idx].forzato;
          }
          else {
            var defInizioHHMM = sel.getAttribute("data-default-inizio") || state.settings.apertura;
            var defFineHHMM = sel.getAttribute("data-default-fine") || state.settings.chiusuraFeriale;
            list[idx] = timbra({
              empId:newVal,
              inizio: isoAt(dataGiorno, defInizioHHMM),
              fine: isoFine(dataGiorno, defInizioHHMM, defFineHHMM)
            }, "manuale");
            if(forzatura) list[idx].forzato = forzatura;
          }
        } else if(list[idx]){
          list.splice(idx,1);
        }
      }
      aggiornaViolazioni(wk, currentWeek);
      recomputeHours(wk);
      registraStorico(wk, "modifica-manuale",
        (newVal ? empName(newVal)+" assegnato a " : "Turno liberato: ")+DAY_LABELS[day]+" · "+(SLOT_LABELS[slotKey]||slotKey)+
        (forzatura ? " (forzato: "+forzatura.motivi.join("; ")+")" : ""));
      saveState(); render();
    });
  });

  // assenze
  var amPrev = document.getElementById("assenze-mese-prev");
  if(amPrev) amPrev.addEventListener("click", function(){ currentAssenzeMonth = shiftMonth(currentAssenzeMonth,-1); render(); });
  var amNext = document.getElementById("assenze-mese-next");
  if(amNext) amNext.addEventListener("click", function(){ currentAssenzeMonth = shiftMonth(currentAssenzeMonth,1); render(); });
  var amPick = document.getElementById("assenze-mese-pick");
  if(amPick) amPick.addEventListener("change", function(){ if(amPick.value) currentAssenzeMonth = amPick.value; render(); });
  document.querySelectorAll("[data-assenza-cell]").forEach(function(sel){
    sel.addEventListener("change", function(){
      var parts = sel.getAttribute("data-assenza-cell").split("|");
      var empId = parts[0], dateStr = parts[1];
      var emp = empById(empId);
      if(!emp) return;
      var val = sel.value;
      emp.assenze = emp.assenze || {};
      if(emp.fineContrattoDal === dateStr) emp.fineContrattoDal = null;
      if(val === "fine_contratto"){
        emp.fineContrattoDal = dateStr;
        Object.keys(emp.assenze).forEach(function(d){ if(d >= dateStr) delete emp.assenze[d]; });
      } else if(val === ""){
        delete emp.assenze[dateStr];
      } else if(val === "rol"){
        emp.assenze[dateStr] = {tipo:"rol", ore: (emp.assenze[dateStr] && emp.assenze[dateStr].ore) || 1};
      } else {
        emp.assenze[dateStr] = {tipo: val};
      }
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-assenza-ore]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var parts = inp.getAttribute("data-assenza-ore").split("|");
      var empId = parts[0], dateStr = parts[1];
      var emp = empById(empId);
      if(!emp || !emp.assenze || !emp.assenze[dateStr]) return;
      emp.assenze[dateStr].ore = Number(inp.value)||0;
      saveState(); render();
    });
  });
  var riepAggiorna = document.getElementById("btn-riepilogo-aggiorna");
  if(riepAggiorna) riepAggiorna.addEventListener("click", function(){
    var dal = document.getElementById("assenze-export-dal").value;
    var al = document.getElementById("assenze-export-al").value;
    if(!dal || !al || dal>al){ alert("Seleziona un periodo valido (Dal ≤ Al)."); return; }
    var tbody = document.getElementById("riepilogo-tbody");
    if(tbody) tbody.innerHTML = renderAssenzeRiepilogoRows(dal, al);
  });
  var exportAssenzeBtn = document.getElementById("btn-assenze-export");
  if(exportAssenzeBtn) exportAssenzeBtn.addEventListener("click", function(){
    var dal = document.getElementById("assenze-export-dal").value;
    var al = document.getElementById("assenze-export-al").value;
    if(!dal || !al || dal>al){ alert("Seleziona un periodo valido (Dal ≤ Al)."); return; }
    exportAssenzeExcel(dal, al);
  });
}

/* dopo una modifica manuale le violazioni vanno ricalcolate: un turno spostato può
   risolvere o creare un'irregolarità anche su un altro turno della stessa persona */
function aggiornaViolazioni(wk, weekStart){
  if(!wk || !wk.assign) return;
  var settings = state.settings;
  var intervalli = intervalliAdiacenti(weekStart);
  raccogliIntervalli(wk.assign, intervalli);
  function oreGiornoDi(empId, day){
    var g = wk.assign[day], tot = 0;
    if(!g) return 0;
    Object.keys(g).forEach(function(key){
      var v = g[key];
      if(!v) return;
      if(key==="cuoco"||key==="cuocoSera"){ if(v.empId===empId && v.inizio && v.fine) tot += durH(v.inizio, v.fine); return; }
      if(!Array.isArray(v)) return;
      v.forEach(function(a){ if(a && a.empId===empId && a.inizio && a.fine) tot += durH(a.inizio, a.fine); });
    });
    return tot;
  }
  DAYS.forEach(function(day){
    var g = wk.assign[day];
    if(!g) return;
    var valuta = function(a){
      if(!a || !a.empId || !a.inizio || !a.fine) return;
      var dur = durH(a.inizio, a.fine);
      var v = violazioniTutela(settings, intervalli[a.empId]||[],
        {inizio:a.inizio, fine:a.fine, oreGiorno:oreGiornoDi(a.empId, day)-dur, durata:dur, ref:a}, weekStart);
      if(v.length) a.violazioni = v; else delete a.violazioni;
      if(!v.length) delete a.accettata;
    };
    Object.keys(g).forEach(function(key){
      var v = g[key];
      if(!v) return;
      if(key==="cuoco"||key==="cuocoSera"){ valuta(v); return; }
      if(Array.isArray(v)) v.forEach(valuta);
    });
  });
}
/* Controlli sull'assegnazione manuale. Non tolgono nessuna opzione dal menu: servono
   a dire al responsabile cosa sta per fare, prima che lo faccia. Le "dure" sono cose
   che il generatore automatico non farebbe mai (una persona in ferie, due postazioni
   nello stesso momento); le "morbide" sono le regole di tutela. */
function controlliManuali(day, slotKey, empId, wk, weekStart){
  var dure = [], morbide = [];
  var e = empById(empId);
  if(!e) return {dure:dure, morbide:morbide};
  var settings = state.settings;
  var dateStr = addDays(weekStart, DAYS.indexOf(day));
  var slotDef = getSlotsForDay(settings, day, dateStr).find(function(s){ return s.key===slotKey; });

  if(e.fineContrattoDal && dateStr >= e.fineContrattoDal){
    dure.push(escapeHtml(e.nome)+" ha il contratto terminato dal "+fmtDateLabel(e.fineContrattoDal));
  }
  var ass = e.assenze && e.assenze[dateStr];
  if(ass){
    var etichetta = ass.tipo==="ferie" ? "in ferie" : (ass.tipo==="malattia" ? "in malattia" : "in ROL");
    dure.push(escapeHtml(e.nome)+" risulta "+etichetta+" il "+fmtDateLabel(dateStr));
  }
  var filtroRuolo = eligibleForSlotKey(slotKey);
  if(!filtroRuolo(e)) dure.push(escapeHtml(e.nome)+" non copre questo ruolo");

  // orari che avrebbe questo turno, per i controlli di sovrapposizione e di tutela
  var inizioIso = null, fineIso = null, dur = 0;
  if(slotKey==="cuoco" || slotKey==="cuoco_sera"){
    var orari = cucinaOrari(settings, day, slotKey==="cuoco"?"fascia1":"fascia2");
    var tipo = e.ruoli.cuoco_capo ? "capo" : "riserva";
    var iniH = (orari && orari.inizio) || settings.cuocoInizio;
    var finH = tipo==="capo" ? ((orari&&orari.fineCapo)||settings.fineTurnoCuocoCapo) : ((orari&&orari.fineRiserva)||settings.fineTurnoCuocoRiserva);
    inizioIso = isoAt(dateStr, iniH); fineIso = isoFine(dateStr, iniH, finH);
  } else if(slotDef){
    inizioIso = isoAt(dateStr, slotDef.inizio); fineIso = isoFine(dateStr, slotDef.inizio, slotDef.fine);
  }
  if(inizioIso && fineIso){
    dur = durH(inizioIso, fineIso);
    var tuttiIntervalli = intervalliAdiacenti(weekStart);
    raccogliIntervalli(wk.assign, tuttiIntervalli);
    var suoi = (tuttiIntervalli[empId]||[]);
    // sovrapposizione: nessuno può stare in due postazioni nello stesso momento
    var sovrapposto = suoi.some(function(iv){
      return ms(iv.inizio) < ms(fineIso) && ms(iv.fine) > ms(inizioIso);
    });
    if(sovrapposto) dure.push(escapeHtml(e.nome)+" è già in turno in un orario che si sovrappone a questo");
    // monte ore settimanale (contratto + straordinario tollerato)
    var max = (Number(e.oreContratto)||0) + (Number(e.straordinario)||0);
    var oreAttuali = (wk.hoursWorked && wk.hoursWorked[empId]) || 0;
    if(!(e.tipoContratto==="chiamata" && max<=0) && oreAttuali + dur > max + 0.001){
      dure.push("con questo turno "+escapeHtml(e.nome)+" supera il monte ore settimanale di "+fmtOre(oreAttuali+dur-max));
    }
    var oreGiorno = 0;
    var g = wk.assign[day] || {};
    Object.keys(g).forEach(function(k){
      var v = g[k];
      if(!v) return;
      if(k==="cuoco"||k==="cuocoSera"){ if(v.empId===empId && v.inizio && v.fine) oreGiorno += durH(v.inizio,v.fine); return; }
      if(Array.isArray(v)) v.forEach(function(a){ if(a && a.empId===empId && a.inizio && a.fine) oreGiorno += durH(a.inizio,a.fine); });
    });
    morbide = violazioniTutela(settings, suoi, {inizio:inizioIso, fine:fineIso, oreGiorno:oreGiorno, durata:dur}, weekStart);
  }
  return {dure:dure, morbide:morbide};
}
function turniIrregolari(wk){
  var out = [];
  if(!wk || !wk.assign) return out;
  DAYS.forEach(function(day){
    var g = wk.assign[day];
    if(!g) return;
    Object.keys(g).forEach(function(key){
      var v = g[key];
      if(!v) return;
      if(key==="cuoco"||key==="cuocoSera"){
        if(v.violazioni && v.violazioni.length) out.push({day:day, key:key, idx:0, entry:v});
        return;
      }
      if(!Array.isArray(v)) return;
      v.forEach(function(a, i){ if(a && a.violazioni && a.violazioni.length) out.push({day:day, key:key, idx:i, entry:a}); });
    });
  });
  return out;
}
function recomputeHours(wk, employeesOverride){
  var employees = employeesOverride || state.employees;
  var hoursWorked = {}, pianificate = {};
  employees.forEach(function(e){ hoursWorked[e.id]=0; pianificate[e.id]=0; });
  forEachAssegnazione(wk, function(a){
    // ore effettive quando il consuntivo è confermato, altrimenti quelle pianificate
    hoursWorked[a.empId] = (hoursWorked[a.empId]||0) + oreDiAssegnazione(a);
    if(a.inizio && a.fine) pianificate[a.empId] = (pianificate[a.empId]||0) + durH(a.inizio, a.fine);
  });
  Object.keys(hoursWorked).forEach(function(k){ hoursWorked[k] = Math.round(hoursWorked[k]*100)/100; });
  Object.keys(pianificate).forEach(function(k){ pianificate[k] = Math.round(pianificate[k]*100)/100; });
  wk.hoursWorked = hoursWorked;
  wk.orePianificate = pianificate;
}

boot();
})();
