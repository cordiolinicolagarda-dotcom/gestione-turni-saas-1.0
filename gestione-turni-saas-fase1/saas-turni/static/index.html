<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 Days Turni</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F3EC;
  --surface:#FFFFFF;
  --surface-2:#EFE8DA;
  --ink:#1E2A2B;
  --ink-muted:#5B6B69;
  --border:#DDD4C2;
  --accent:#C97A3D;
  --accent-strong:#AD6329;
  --accent-ink:#FFFFFF;
  --teal:#2F6E6B;
  --teal-soft:#E1EDEC;
  --wine:#8B4B5C;
  --wine-soft:#F1E3E6;
  --amber-soft:#F6E7D8;
  --success:#3F7A4C;
  --success-soft:#E4EFE3;
  --danger:#B54B3A;
  --danger-soft:#F8E4DF;
  --warning:#9C6B1F;
  --warning-soft:#F3E7D2;
  --shadow: 0 1px 2px rgba(30,42,43,.06), 0 6px 20px rgba(30,42,43,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12191A;
    --surface:#1B2426;
    --surface-2:#222E30;
    --ink:#EDE7DA;
    --ink-muted:#9FAFAC;
    --border:#33474A;
    --accent:#E0975A;
    --accent-strong:#EEB07E;
    --accent-ink:#1B2426;
    --teal:#6FB2AC;
    --teal-soft:#1E3634;
    --wine:#D599A6;
    --wine-soft:#3A2529;
    --amber-soft:#3A2C1C;
    --success:#7CBB86;
    --success-soft:#203323;
    --danger:#E28A78;
    --danger-soft:#3A2420;
    --warning:#D9AE68;
    --warning-soft:#3A2E17;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12191A;
  --surface:#1B2426;
  --surface-2:#222E30;
  --ink:#EDE7DA;
  --ink-muted:#9FAFAC;
  --border:#33474A;
  --accent:#E0975A;
  --accent-strong:#EEB07E;
  --accent-ink:#1B2426;
  --teal:#6FB2AC;
  --teal-soft:#1E3634;
  --wine:#D599A6;
  --wine-soft:#3A2529;
  --amber-soft:#3A2C1C;
  --success:#7CBB86;
  --success-soft:#203323;
  --danger:#E28A78;
  --danger-soft:#3A2420;
  --warning:#D9AE68;
  --warning-soft:#3A2E17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Fraunces","Public Sans",serif;font-weight:600;text-wrap:balance;margin:0;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
button,select,input{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

#app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.hero-title{font-size:2.1rem;letter-spacing:-.01em;}
.hero-title small{display:block;font-family:"Public Sans",sans-serif;font-weight:600;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:6px;}
.hero-sub{color:var(--ink-muted);font-size:.92rem;max-width:46ch;}

.tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);}
.tab-btn{background:none;border:none;padding:11px 18px;border-radius:8px 8px 0 0;font-weight:600;color:var(--ink-muted);position:relative;top:1px;}
.tab-btn.active{color:var(--ink);background:var(--surface);border:1px solid var(--border);border-bottom-color:var(--surface);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{font-size:1.15rem;margin-bottom:4px;}
.card .card-desc{color:var(--ink-muted);font-size:.85rem;margin-bottom:16px;}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:760px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

label.field{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600;color:var(--ink-muted);}
label.field input[type="text"],label.field input[type="number"],label.field input[type="time"],label.field input[type="date"],label.field select{
  border:1px solid var(--border);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font-weight:500;font-size:.9rem;
}
label.field input:focus,label.field select:focus{border-color:var(--accent);}
.btn-row > input[type="text"],.btn-row > input[type="date"],.btn-row > select{
  border:1px solid var(--border);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 10px;font-weight:500;font-size:.86rem;
}
.hint{color:var(--ink-muted);}
.hero-logo{max-height:56px;max-width:180px;border-radius:8px;display:block;margin-bottom:10px;}
.logo-preview{max-height:80px;max-width:240px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--bg);}
.sugg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--border);}
.sugg-row:last-child{border-bottom:none;}
.sugg-data{min-width:132px;font-weight:700;font-size:.84rem;}
.check{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:500;color:var(--ink);}
.check input{width:16px;height:16px;accent-color:var(--accent);}

.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:9px;font-weight:600;font-size:.86rem;transition:transform .08s ease;}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent;background:none;}
.btn-danger{color:var(--danger);}
.btn-sm{padding:5px 10px;font-size:.78rem;border-radius:7px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

table{border-collapse:collapse;width:100%;}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.86rem;white-space:nowrap;}
thead th{background:var(--surface-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:700;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.02em;}
.pill-teal{background:var(--teal-soft);color:var(--teal);}
.pill-amber{background:var(--amber-soft);color:var(--accent-strong);}
.pill-wine{background:var(--wine-soft);color:var(--wine);}
.pill-success{background:var(--success-soft);color:var(--success);}
.pill-warning{background:var(--warning-soft);color:var(--warning);}
.pill-danger{background:var(--danger-soft);color:var(--danger);}

.empty-note{color:var(--ink-muted);font-size:.88rem;padding:18px;text-align:center;border:1px dashed var(--border);border-radius:10px;}

.seed-banner{background:var(--amber-soft);border:1px solid var(--accent);color:var(--accent-strong);border-radius:10px;padding:10px 14px;font-size:.82rem;font-weight:600;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;}

.emp-row{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--surface);}
.emp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.emp-name{font-weight:700;font-size:1.02rem;}
.emp-roles{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.avail-grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:6px;align-items:center;margin-top:14px;font-size:.78rem;}
.avail-grid .dow{text-align:center;font-weight:700;color:var(--ink-muted);text-transform:uppercase;font-size:.68rem;letter-spacing:.04em;}
.avail-cell{display:flex;flex-direction:column;gap:4px;align-items:center;padding:6px 4px;border-radius:8px;background:var(--surface-2);}
.avail-cell label{display:flex;gap:4px;align-items:center;font-size:.68rem;color:var(--ink-muted);}
.avail-cell input{width:13px;height:13px;accent-color:var(--teal);}

.week-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.week-bar .spacer{flex:1;}

.assenze-table th, .assenze-table td{padding:4px 3px;text-align:center;white-space:nowrap;font-size:.78rem;}
.assenze-table thead th{position:sticky;top:0;}
.assenze-table .assenze-name-col{text-align:left;white-space:nowrap;font-weight:700;position:sticky;left:0;background:var(--surface);z-index:1;}
.assenze-table thead th.assenze-name-col{background:var(--surface-2);z-index:2;}
.assenze-table th.assenze-col-weekend, .assenze-table td.assenze-col-weekend{background:var(--surface-2);}
.assenza-td{min-width:56px;}
.assenza-cell{display:flex;flex-direction:column;align-items:center;gap:2px;}
.assenza-cell select{width:100%;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--ink);font-size:.66rem;padding:3px 1px;text-align:center;}
.assenza-cell.assenza-ferie select{background:var(--amber-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:700;}
.assenza-cell.assenza-malattia select{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);font-weight:700;}
.assenza-cell.assenza-rol select{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:700;}
.assenza-cell.assenza-fine_contratto select{background:var(--wine-soft);border-color:var(--wine);color:var(--wine);font-weight:700;}
.assenza-cell .assenza-ore{width:38px;margin-top:1px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--ink);font-size:.62rem;padding:1px 2px;text-align:center;}
.assenza-cell-terminato{color:var(--ink-muted);font-size:.72rem;opacity:.55;padding:5px 0;}

.gap-banner{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.86rem;}
.gap-banner ul{margin:6px 0 0;padding-left:18px;}

.conflitto-bar{background:var(--warning-soft);border:1px solid var(--warning);color:var(--warning);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:.88rem;}
.conflitto-bar strong{color:var(--ink);}
.valid-banner{border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.86rem;}
.valid-banner.errori{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);}
.valid-banner.avvisi{background:var(--warning-soft);border:1px solid var(--warning);color:var(--warning);}
.valid-banner ul{margin:6px 0 0;padding-left:18px;}
.stato-bar{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.86rem;border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);}
.stato-bar strong{color:var(--ink);}
.stato-bar.stato-pubblicata{border-color:var(--success);background:var(--success-soft);}
.stato-bar.stato-modificata{border-color:var(--warning);background:var(--warning-soft);}
.stato-bar .pill{margin-right:6px;}
.irr-banner{background:var(--warning-soft);border:1px solid var(--warning);color:var(--warning);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.86rem;}
.irr-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.irr-desc{margin-top:4px;font-size:.94em;opacity:.9;}
.irr-list{margin:8px 0 0;padding-left:18px;}
.irr-list li{margin-bottom:5px;}
.irr-when{font-weight:700;}
.slot-person-irregolare{outline:2px solid var(--warning);outline-offset:-2px;}
.slot-warn{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:700;color:var(--warning);margin-top:2px;line-height:1.25;}
.slot-warn.ok{color:var(--success);}

.sched-table th, .sched-table td{vertical-align:top;}
.sched-table thead th{position:sticky;top:0;}
.sched-table td.role-col{font-weight:700;color:var(--ink-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;white-space:normal;background:var(--surface-2);}
.slot-cell{min-width:150px;}
.slot-people{display:flex;flex-direction:column;gap:6px;}
.slot-person{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:8px;background:var(--teal-soft);}
.slot-person.role-banco{background:var(--amber-soft);}
.slot-person.role-sala{background:var(--wine-soft);}
.slot-person .pname{font-weight:700;font-size:.82rem;}
.slot-person .ptime{font-size:.7rem;color:var(--ink-muted);}
.slot-person select{width:100%;border:none;background:transparent;font-weight:700;font-size:.82rem;padding:0;}
.slot-empty{border:1px dashed var(--danger);color:var(--danger);border-radius:8px;padding:6px 8px;font-size:.78rem;font-weight:600;text-align:center;}
.slot-person-empty{background:transparent;border:1px dashed var(--danger);}
.slot-person-empty select{color:var(--danger);}

.hours-badge{font-weight:700;}

footer.hint{margin-top:30px;color:var(--ink-muted);font-size:.78rem;text-align:center;}

.print-only-header{display:none;}

@media print{
  @page{ size: landscape; margin: 8mm; }
  .no-print{display:none !important;}
  body{background:#fff;}
  .card,.table-wrap{box-shadow:none;border-color:#999;}
  .print-only-header{display:block;margin-bottom:12px;}
  .print-only-header h2{font-size:1.25rem;}
  body.planner-print-mode .hide-in-planner-print,
  body.planner-print-mode .hero{display:none !important;}
  body.planner-print-mode #app{padding:0;max-width:none;}
  body.planner-print-mode .print-only-header{margin-bottom:6px;}
  body.planner-print-mode .print-only-header h2{font-size:1rem;}
  body.planner-print-mode .table-wrap{overflow:visible;border:none;}
  body.planner-print-mode .sched-table{table-layout:fixed;width:100%;font-size:7.5px;}
  body.planner-print-mode .sched-table th, body.planner-print-mode .sched-table td{white-space:normal;padding:2px 3px;overflow-wrap:break-word;}
  body.planner-print-mode .sched-table th:first-child, body.planner-print-mode .sched-table td:first-child{width:10%;}
  body.planner-print-mode .sched-table thead th{font-size:6.5px;padding:3px 3px;}
  body.planner-print-mode .sched-table thead th div{font-size:6px;}
  body.planner-print-mode .role-col{font-size:6px;line-height:1.15;}
  body.planner-print-mode .slot-cell{min-width:0;}
  body.planner-print-mode .slot-people{gap:2px;}
  body.planner-print-mode .slot-person, body.planner-print-mode .slot-person-empty{padding:2px 3px;border-radius:4px;}
  body.planner-print-mode .slot-person .pname{font-size:7px;}
  body.planner-print-mode .ptime{font-size:6px;}
  body.planner-print-mode .pill{font-size:5.5px;padding:1px 4px;}
  body.planner-print-mode select{border:none;background:transparent !important;pointer-events:none;-webkit-appearance:none;appearance:none;padding:0;font-size:7px;font-weight:700;width:100%;}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";

var LS_KEY = "turni9days_v1";
var DAYS = ["lunedi","martedi","mercoledi","giovedi","venerdi","sabato","domenica"];
var DAY_LABELS = {lunedi:"Lunedì",martedi:"Martedì",mercoledi:"Mercoledì",giovedi:"Giovedì",venerdi:"Venerdì",sabato:"Sabato",domenica:"Domenica"};
var DAY_SHORT = {lunedi:"Lun",martedi:"Mar",mercoledi:"Mer",giovedi:"Gio",venerdi:"Ven",sabato:"Sab",domenica:"Dom"};
var WEEKEND = {sabato:true,domenica:true};

function uid(){ return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- orari per-giorno (fasce) e priorità per-fascia: utilità ---------- */
function deriveFasceFromDayTiers(giorniPicco, giorniPriorita2){
  var out = {};
  DAYS.forEach(function(d){
    var t = giorniPicco[d] ? 1 : (giorniPriorita2[d] ? 2 : 3);
    out[d] = {mattina:t, pomeriggio:t, sera:t};
  });
  return out;
}
function defaultOrariGiorni(apertura, chiusuraFeriale, chiusuraWeekend, puntoMedioFeriale, puntoMedioWeekend){
  var out = {};
  DAYS.forEach(function(d){
    var weekend = isWeekend(d);
    out[d] = {
      fascia1: { inizio: apertura, fine: weekend?chiusuraWeekend:chiusuraFeriale, puntoMedio: weekend?puntoMedioWeekend:puntoMedioFeriale },
      fascia2: null
    };
  });
  return out;
}
function defaultOrariCucina(cuocoInizio, fineTurnoCuocoCapo, fineTurnoCuocoRiserva){
  var out = {};
  DAYS.forEach(function(d){
    out[d] = {
      fascia1: {inizio:cuocoInizio, fineCapo:fineTurnoCuocoCapo, fineRiserva:fineTurnoCuocoRiserva},
      fascia2: null
    };
  });
  return out;
}

function defaultAzienda(){
  return {
    ragioneSociale:"", piva:"", codiceFiscale:"", pec:"", codiceSdi:"",
    indirizzo:"", cap:"", comune:"", provincia:"", regione:"",
    telefono:"", email:"",
    logo:null,               // immagine in formato data:URI, ridimensionata al salvataggio
    eventiLocali:[]          // [{mmdd:"06-29", nome:"Sagra del paese"}] — ricorrono ogni anno
  };
}

function defaultSettings(){
  var apertura = "08:00", chiusuraFeriale = "21:00", chiusuraWeekend = "22:00";
  var puntoMedioFeriale = "14:30", puntoMedioWeekend = "15:00";
  var cuocoInizio = "07:00", fineTurnoCuocoCapo = "15:00", fineTurnoCuocoRiserva = "14:00";
  var giorniPicco = {lunedi:true,martedi:false,mercoledi:false,giovedi:false,venerdi:false,sabato:true,domenica:true};
  var giorniPriorita2 = {lunedi:false,martedi:false,mercoledi:false,giovedi:false,venerdi:true,sabato:false,domenica:false};
  return {
    barName:"9 Days Bar",
    apertura:apertura,
    chiusuraFeriale:chiusuraFeriale,
    chiusuraWeekend:chiusuraWeekend,
    cuocoInizio:cuocoInizio,
    fineTurnoCuocoCapo:fineTurnoCuocoCapo,
    fineTurnoCuocoRiserva:fineTurnoCuocoRiserva,
    minutiCucinaPrimaFineTurno:30,
    camerierArrivo:"08:00",
    bancoInizio:"07:00",
    puntoMedioFeriale:puntoMedioFeriale,
    puntoMedioWeekend:puntoMedioWeekend,
    spezzatiDiDefault:false,
    salaNormale:1,
    bancoNormale:1,
    salaPicco:2,
    bancoPicco:1,
    giorniPicco:giorniPicco,
    giorniPriorita2:giorniPriorita2,
    oreGiornaliereMax:10,
    paritaStraordinariEnabled:true,
    paritaStraordinariFinestra:4,
    ordinePriorita:["cucina","banco","sala"],
    configurazioniPriorita:[],
    azienda: defaultAzienda(),
    orariGiorni: defaultOrariGiorni(apertura, chiusuraFeriale, chiusuraWeekend, puntoMedioFeriale, puntoMedioWeekend),
    cucinaSegueFasce:false,
    orariCucina: defaultOrariCucina(cuocoInizio, fineTurnoCuocoCapo, fineTurnoCuocoRiserva),
    prioritaFasce: deriveFasceFromDayTiers(giorniPicco, giorniPriorita2),
    regoleTutela: defaultRegoleTutela(),
    stagioni: [],
    deroghe: {}
  };
}
function defaultRegoleTutela(){
  return {
    riposoGiornaliero: {attiva:true, ore:11},
    riposoSettimanale: {attiva:true, ore:24},
    giorniConsecutivi: {attiva:true, max:6}
  };
}

/* ---------- priorità reparti: preset e utilità ---------- */
var DEPARTMENTS = ["cucina","banco","sala"];
var DEPARTMENT_LABELS = {cucina:"Cucina", banco:"Banco", sala:"Sala"};
var BANDE = ["mattina","pomeriggio","sera"];
var BANDA_LABELS = {mattina:"Mattina", pomeriggio:"Pomeriggio", sera:"Sera"};
/* I livelli restano numerici nel modello dati (1 è il più protetto: tutto il motore

function normalizePriorityOrder(order){
  var out = (order||[]).filter(function(d){ return DEPARTMENTS.indexOf(d)!==-1; });
  DEPARTMENTS.forEach(function(d){ if(out.indexOf(d)===-1) out.push(d); });
  return out.slice(0,3);
}

/* ---------- configurazioni di priorità salvate dall'utente ----------
   Non esistono più configurazioni "di fabbrica": ogni attività ha la propria stagionalità
   e la propria idea di cosa proteggere per primo. Qui si fotografa la configurazione
   corrente, le si dà un nome e la si richiama quando serve (es. "Estate", "Inverno",
   "Settimana della sagra"). */
function istantaneaPriorita(s){
  var cloneDayMap = function(m){ var o={}; DAYS.forEach(function(d){ o[d]=!!(m&&m[d]); }); return o; };
  var pf = {};
  DAYS.forEach(function(d){
    var src = (s.prioritaFasce && s.prioritaFasce[d]) || {};
    pf[d] = {
      mattina: Number(src.mattina)||3,
      pomeriggio: Number(src.pomeriggio)||3,
      sera: Number(src.sera)||3
    };
  });
  return {
    ordinePriorita: normalizePriorityOrder(s.ordinePriorita).slice(),
    giorniPicco: cloneDayMap(s.giorniPicco),
    giorniPriorita2: cloneDayMap(s.giorniPriorita2),
    prioritaFasce: pf
  };
}
function applicaIstantaneaPriorita(s, cfg){
  var snap = istantaneaPriorita(cfg);
  s.ordinePriorita = snap.ordinePriorita;
  s.giorniPicco = snap.giorniPicco;
  s.giorniPriorita2 = snap.giorniPriorita2;
  s.prioritaFasce = snap.prioritaFasce;
}
function normalizzaConfigurazioni(lista){
  if(!Array.isArray(lista)) return [];
  return lista.filter(function(c){ return c && typeof c==="object"; }).map(function(c){
    var snap = istantaneaPriorita(c);
    snap.id = c.id || uid();
    snap.nome = String(c.nome || "Configurazione senza nome");
    snap.salvataIl = c.salvataIl || null;
    return snap;
  });
}

function normalizeState(parsed){
  if(!parsed || typeof parsed!=="object") parsed = {};
  if(!parsed.settings) parsed.settings = defaultSettings();
  if(!parsed.employees) parsed.employees = [];
  if(!parsed.weeks) parsed.weeks = {};
  // migrazione: "chiusura cucina" (vecchio modello) -> "fine turno cuoco" (nuovo modello, stesso orario riusato)
  if(parsed.settings.fineTurnoCuocoCapo===undefined){
    parsed.settings.fineTurnoCuocoCapo = parsed.settings.chiusuraCucinaCapo || defaultSettings().fineTurnoCuocoCapo;
  }
  if(parsed.settings.fineTurnoCuocoRiserva===undefined){
    parsed.settings.fineTurnoCuocoRiserva = parsed.settings.chiusuraCucinaRiserva || defaultSettings().fineTurnoCuocoRiserva;
  }
  delete parsed.settings.chiusuraCucinaCapo;
  delete parsed.settings.chiusuraCucinaRiserva;
  if(parsed.settings.giorniPriorita2===undefined) parsed.settings.giorniPriorita2 = defaultSettings().giorniPriorita2;
  delete parsed.settings.oreGiornaliereBase; // manopola mai collegata a nessuna logica: rimossa
  if(parsed.settings.oreGiornaliereMax===undefined) parsed.settings.oreGiornaliereMax = defaultSettings().oreGiornaliereMax;
  if(parsed.settings.paritaStraordinariEnabled===undefined) parsed.settings.paritaStraordinariEnabled = defaultSettings().paritaStraordinariEnabled;
  if(parsed.settings.paritaStraordinariFinestra===undefined) parsed.settings.paritaStraordinariFinestra = defaultSettings().paritaStraordinariFinestra;
  delete parsed.settings.prioritaProfilo; // le configurazioni di fabbrica non esistono più
  if(parsed.settings.ordinePriorita===undefined) parsed.settings.ordinePriorita = defaultSettings().ordinePriorita;
  parsed.settings.ordinePriorita = normalizePriorityOrder(parsed.settings.ordinePriorita);
  parsed.settings.configurazioniPriorita = normalizzaConfigurazioni(parsed.settings.configurazioniPriorita);
  // anagrafica dell'attività: campo nuovo, si aggiunge senza toccare nulla di esistente
  var azDef = defaultAzienda();
  if(!parsed.settings.azienda || typeof parsed.settings.azienda!=="object") parsed.settings.azienda = azDef;
  Object.keys(azDef).forEach(function(k){
    if(parsed.settings.azienda[k]===undefined) parsed.settings.azienda[k] = azDef[k];
  });
  if(!Array.isArray(parsed.settings.azienda.eventiLocali)) parsed.settings.azienda.eventiLocali = [];
  parsed.settings.azienda.eventiLocali = parsed.settings.azienda.eventiLocali
    .filter(function(e){ return e && /^\d{2}-\d{2}$/.test(String(e.mmdd||"")); })
    .map(function(e){ return {mmdd:String(e.mmdd), nome:String(e.nome||"Evento locale")}; });
  // migrazione: orari per-giorno con doppia fascia (sostituiscono i vecchi orari globali unici come
  // sorgente di verità per la generazione, ma i vecchi campi restano come fallback innocuo altrove)
  if(parsed.settings.orariGiorni===undefined){
    parsed.settings.orariGiorni = defaultOrariGiorni(
      parsed.settings.apertura, parsed.settings.chiusuraFeriale, parsed.settings.chiusuraWeekend,
      parsed.settings.puntoMedioFeriale, parsed.settings.puntoMedioWeekend
    );
  }
  if(parsed.settings.cucinaSegueFasce===undefined) parsed.settings.cucinaSegueFasce = false;
  if(parsed.settings.orariCucina===undefined){
    parsed.settings.orariCucina = defaultOrariCucina(
      parsed.settings.cuocoInizio, parsed.settings.fineTurnoCuocoCapo, parsed.settings.fineTurnoCuocoRiserva
    );
  }
  if(parsed.settings.prioritaFasce===undefined){
    parsed.settings.prioritaFasce = deriveFasceFromDayTiers(parsed.settings.giorniPicco, parsed.settings.giorniPriorita2);
  }
  if(!Array.isArray(parsed.settings.stagioni)) parsed.settings.stagioni = [];
  // una stagione con orari propri deve averli per TUTTI i giorni: se ne manca uno, il
  // giorno scoperto tornerebbe agli orari standard senza che si veda da nessuna parte.
  var orariBase = defaultOrariGiorni(
    parsed.settings.apertura || "08:00", parsed.settings.chiusuraFeriale || "21:00",
    parsed.settings.chiusuraWeekend || "22:00", parsed.settings.puntoMedioFeriale || "14:30",
    parsed.settings.puntoMedioWeekend || "15:00"
  );
  DAYS.forEach(function(d){
    // un giorno mancante manderebbe in errore mezza app (e il catch riporterebbe ai dati
    // di esempio, cioè alla perdita di tutto): meglio ricostruirlo in silenzio
    if(!parsed.settings.orariGiorni[d] || !parsed.settings.orariGiorni[d].fascia1){
      parsed.settings.orariGiorni[d] = orariBase[d];
    }
  });
  parsed.settings.stagioni.forEach(function(st){
    if(!st || !st.orariGiorni) return;
    DAYS.forEach(function(d){
      var og = st.orariGiorni[d];
      if(!og || !og.fascia1){
        st.orariGiorni[d] = JSON.parse(JSON.stringify(parsed.settings.orariGiorni[d]));
      } else if(og.fascia2===undefined){
        og.fascia2 = null;
      }
    });
  });
  if(!parsed.settings.deroghe || typeof parsed.settings.deroghe!=="object") parsed.settings.deroghe = {};
  if(parsed.settings.regoleTutela===undefined) parsed.settings.regoleTutela = defaultRegoleTutela();
  var rtDef = defaultRegoleTutela();
  Object.keys(rtDef).forEach(function(k){
    if(!parsed.settings.regoleTutela[k]) parsed.settings.regoleTutela[k] = rtDef[k];
  });
  parsed.employees.forEach(function(e){
    if(!e.assenze) e.assenze = {};
    if(e.fineContrattoDal===undefined) e.fineContrattoDal = null;
    if(!e.disponibilita) e.disponibilita = defaultAvail();
    DAYS.forEach(function(d){
      if(!e.disponibilita[d]) e.disponibilita[d] = {mattina:true,pomeriggio:true,sera:true};
      if(e.disponibilita[d].sera===undefined) e.disponibilita[d].sera = true;
    });
    // giorni lavorativi a settimana: si precompila dai giorni in cui la persona si è
    // dichiarata disponibile (max 6), così nessuno deve riempire a mano tutte le schede.
    // Resta modificabile: sul contratto il dato c'è già.
    if(!e.giorniLavorativi){
      var gg = DAYS.filter(function(d){
        var dd = e.disponibilita[d];
        return dd && (dd.mattina || dd.pomeriggio || dd.sera);
      }).length;
      e.giorniLavorativi = Math.min(6, Math.max(1, gg||5));
    }
  });
  // migrazione: da "HH:MM dentro un giorno" a istanti assoluti nelle assegnazioni salvate.
  // Deterministica (la data si ricava da settimana + giorno) e idempotente. Effetto
  // collaterale voluto: gli eventuali turni notturni già archiviati, che finora
  // producevano ore negative, vengono corretti retroattivamente.
  Object.keys(parsed.weeks).forEach(function(weekStart){
    var wk = parsed.weeks[weekStart];
    if(!wk || !wk.assign) return;
    var migrato = false;
    DAYS.forEach(function(day, idx){
      var giorno = wk.assign[day];
      if(!giorno) return;
      var dataGiorno = addDays(weekStart, idx);
      ["cuoco","cuocoSera"].forEach(function(campo){
        var c = giorno[campo];
        if(!c || !c.inizio || !isTimeOnly(c.inizio)) return;
        var inizioHHMM = c.inizio, fineHHMM = c.fine;
        c.inizio = isoAt(dataGiorno, inizioHHMM);
        c.fine = isoFine(dataGiorno, inizioHHMM, fineHHMM);
        if(c.chiusuraCucina) c.chiusuraCucina = addMinIso(c.fine, -(Number(parsed.settings.minutiCucinaPrimaFineTurno)||0));
        migrato = true;
      });
      Object.keys(giorno).forEach(function(key){
        if(key==="cuoco" || key==="cuocoSera") return;
        var lista = giorno[key];
        if(!Array.isArray(lista)) return;
        lista.forEach(function(a){
          if(!a || !a.inizio || !isTimeOnly(a.inizio)) return;
          var inizioHHMM = a.inizio, fineHHMM = a.fine;
          a.inizio = isoAt(dataGiorno, inizioHHMM);
          a.fine = isoFine(dataGiorno, inizioHHMM, fineHHMM);
          migrato = true;
        });
      });
    });
    // le ore salvate erano calcolate con il vecchio metodo: si rifanno sui nuovi istanti
    if(migrato) recomputeHours(wk, parsed.employees);
  });
  return parsed;
}

function loadStateLocal(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ return normalizeState(JSON.parse(raw)); }
  }catch(e){ console.warn("Impossibile leggere i dati salvati, riparto da zero.", e); }
  return { settings:defaultSettings(), employees:seedEmployees(), weeks:{}, isSeed:true };
}

function syncBadgeInfo(){
  if(!USE_API) return {cls:"", label:"💾 Solo su questo browser"};
  if(syncStatus==="saving") return {cls:"pill-teal", label:"🔄 Salvataggio…"};
  if(syncStatus==="error") return {cls:"pill-danger", label:"⚠️ Errore di rete — riprovo…"};
  if(syncStatus==="conflict") return {cls:"pill-warning", label:"🔁 Aggiornato da un altro computer"};

}
function setSyncStatus(s){
  syncStatus = s;
  var el = document.getElementById("sync-badge");
  if(el){ var info = syncBadgeInfo(); el.className = "pill "+info.cls; el.innerHTML = info.label; }
}
function scheduleApiSave(){
  setSyncStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doApiSave, 300);
}
/* Salvataggio non distruttivo: quando arriva una versione più recente dal server,
   il lavoro in corso non viene MAI sostituito in silenzio. Si mostra cos'è successo e
   si lascia scegliere. Vale sia per il conflitto in salvataggio sia per il controllo
   automatico periodico, che prima faceva la stessa sostituzione senza dirlo. */
function doApiSave(){
  // si dichiara SU QUALE LOCALE si sta scrivendo: il locale corrente vive nella
  // sessione, condivisa da tutte le schede del browser, e se in un'altra scheda
  // qualcuno lo cambia questi turni finirebbero sopra quelli di un'altra attività
  var corpo = {version:apiVersion, data:state};
  if(sessione && sessione.locale) corpo.locale_id = sessione.locale.id;
  fetch("/api/state", {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(corpo)})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, body:j}; }); })
    .then(function(res){
      if(res.status===200){
        apiVersion = res.body.version;
        modifichePendenti = false;
        conflitto = null;
        setSyncStatus("ok");
      }
      else if(res.status===409 && res.body && res.body.error==="locale-cambiato"){
        setSyncStatus("error");
        alert("Il locale selezionato è cambiato in un'altra scheda del browser.\n\nPer non scrivere i turni di questo locale sopra quelli di un altro, questa scheda va ricaricata. Le modifiche non salvate andranno perse.");
        window.location.reload();
      }
      else if(res.status===409){
        conflitto = {version: res.body.version, data: res.body.data, quando: new Date().toISOString()};
        setSyncStatus("conflict");
        render();
      } else { setSyncStatus("error"); }
    })
    .catch(function(){ setSyncStatus("error"); });
}
function risolviConflitto(scelta){
  if(!conflitto) return;
  if(scelta==="mie"){
    // si tiene il lavoro locale: si riparte dalla versione del server e si risalva
    apiVersion = conflitto.version;
    conflitto = null;
    setSyncStatus("saving");
    doApiSave();
    render();
  } else {
    // si prende la versione aggiornata, perdendo le modifiche locali: solo su scelta esplicita
    apiVersion = conflitto.version;
    state = normalizeState(conflitto.data);
    conflitto = null;
    modifichePendenti = false;
    setSyncStatus("ok");
    render();
  }
}
/* C'è un campo in scrittura in questo momento? */
function staScrivendo(){
  var el = document.activeElement;
  if(!el || !el.tagName) return false;
  var tag = el.tagName.toLowerCase();
  if(tag!=="input" && tag!=="select" && tag!=="textarea") return false;
  var app = document.getElementById("app");
  return !!(app && app.contains(el));
}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(function(){
    // niente sostituzioni mentre si sta modificando qualcosa, o con modifiche non ancora
    // salvate, o con un conflitto già aperto in attesa di una scelta
    if(!USE_API || editingEmpId!==null || modifichePendenti || conflitto) return;
    // e nemmeno mentre si sta scrivendo in un campo: molti campi (nome della stagione,
    // ragione sociale, orari) si salvano solo quando si esce dal campo, e un ridisegno
    // in quel momento cancellerebbe quello che si sta digitando
    if(staScrivendo()) return;
    fetch("/api/state",{cache:"no-store"}).then(function(r){return r.json();}).then(function(res){
      if(!res) return;
      // se nel frattempo è cambiato il locale (da un'altra scheda) non si mescolano
      // i dati di due attività diverse: si ricarica e basta
      if(sessione && sessione.locale && res.locale_id && res.locale_id!==sessione.locale.id){
        window.location.reload();
        return;
      }
      if(typeof res.version==="number" && res.version!==apiVersion){
        apiVersion = res.version; state = normalizeState(res.data); render();
      }
    }).catch(function(){});
  }, 20000);
}
/* Chi sta usando l'app: organizzazione, locale corrente, elenco dei locali e ruolo.
   Quando il backend non c'è (file aperto in locale) resta null e l'app si comporta
   come sempre: permessi pieni, nessun selettore. */
var sessione = null;
function soloLettura(){ return !!(sessione && sessione.puoModificare===false); }
function caricaSessione(){
  return fetch("/api/whoami",{cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(info){ sessione = info; })
    .catch(function(){ sessione = null; });
}
/* La sola lettura è una cortesia dell'interfaccia: il divieto vero sta sul server,
   che rifiuta il salvataggio a chi non ha il ruolo. Qui si evita solo di far
   compilare a qualcuno un modulo che poi verrebbe respinto. */
function applicaSolaLettura(){
  if(!soloLettura()) return;
  var app = document.getElementById("app");
  app.querySelectorAll("button, input, select, textarea").forEach(function(el){
    if(el.hasAttribute("data-tab") || el.id==="locale-picker") return;
    el.disabled = true;
  });
}
function boot(){
  caricaSessione().then(bootStato);
}
function bootStato(){
  fetch("/api/state",{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("api non disponibile");
    return r.json();
  }).then(function(res){
    USE_API = true;
    apiVersion = res.version||0;
    if(res.data){ state = normalizeState(res.data); }
    else { state = { settings:defaultSettings(), employees:seedEmployees(), weeks:{}, isSeed:true }; apiVersion = 0; }
    render();
    startPolling();
    if(!res.data){ saveState(); }
  }).catch(function(){
    USE_API = false;
    state = loadStateLocal();
    render();
  });
}

/* ---------- helpers di data/ora ---------- */
function isoDate(d){
  var y=d.getFullYear(), m=("0"+(d.getMonth()+1)).slice(-2), day=("0"+d.getDate()).slice(-2);
  return y+"-"+m+"-"+day;
}
function mondayOf(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  var wd = d.getDay();
  var diff = (wd===0? -6 : 1-wd);
  d.setDate(d.getDate()+diff);
  return isoDate(d);
}
function addDays(dateStr,n){
  var d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return isoDate(d);
}
function fmtDateLabel(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"short"});
}
function timeToMin(t){ var p=t.split(":"); return (+p[0])*60+(+p[1]); }
function minToTime(m){
  m = ((m%1440)+1440)%1440;
  var h = Math.floor(m/60), mm = m%60;
  return ("0"+h).slice(-2)+":"+("0"+mm).slice(-2);
}
function addMin(t,n){ return minToTime(timeToMin(t)+n); }
function isWeekend(day){ return !!WEEKEND[day]; }
function dayType(day){ return isWeekend(day) ? "weekend" : "feriale"; }

/* ---------- istanti assoluti ----------
   Gli ORARI delle impostazioni restano "HH:MM": sono modelli che si ripetono ogni
   settimana. Le ASSEGNAZIONI invece portano istanti veri ("2026-09-12T19:00"), perché
   un turno accade una volta sola, in una data precisa. La conversione avviene al
   momento della generazione, quando la data del giorno è nota.
   Regola che elimina le durate negative dei turni notturni: se l'orario di fine è
   minore o uguale a quello di inizio, la fine cade il giorno successivo. */
function isTimeOnly(v){ return typeof v==="string" && v.length<=5 && v.indexOf("T")===-1; }
function isoAt(dateStr, hhmm){ return dateStr+"T"+hhmm; }
function isoDay(iso){ return String(iso).slice(0,10); }
function isoTime(iso){ return String(iso).slice(11,16); }
function isoToDate(iso){ return new Date(String(iso)); } // stringa locale senza fuso: interpretata come ora locale
function isoFromDate(d){
  var y=d.getFullYear(), m=("0"+(d.getMonth()+1)).slice(-2), day=("0"+d.getDate()).slice(-2);
  var h=("0"+d.getHours()).slice(-2), mi=("0"+d.getMinutes()).slice(-2);
  return y+"-"+m+"-"+day+"T"+h+":"+mi;
}
/* materializza un orario "HH:MM" di fine sul giorno giusto rispetto all'inizio */
function isoFine(dateStr, inizioHHMM, fineHHMM){
  var giorno = timeToMin(fineHHMM) <= timeToMin(inizioHHMM) ? addDays(dateStr,1) : dateStr;
  return isoAt(giorno, fineHHMM);
}
function addMinIso(iso, n){
  var d = isoToDate(iso);
  d.setMinutes(d.getMinutes()+n);
  return isoFromDate(d);
}
/* durata reale tra due istanti: passando dalle date vere resta corretta anche nella
   notte del cambio d'ora (7 o 9 ore invece di 8, che è quanto si lavora davvero) */
function durH(a, b){
  if(a==null || b==null) return 0;
  return Math.round((((isoToDate(b) - isoToDate(a))/3600000))*100)/100;
}
function minutiTra(a, b){ return Math.round((isoToDate(b) - isoToDate(a))/60000); }
/* etichetta di un intervallo per la griglia: "19:00–01:00 +1" quando scavalca la mezzanotte */
function fmtIntervallo(inizio, fine){
  if(!inizio || !fine) return "";
  var testo = isoTime(inizio)+"–"+isoTime(fine);
  if(isoDay(fine) !== isoDay(inizio)) testo += " +1";
  return testo;
}

/* ---------- costruzione turni richiesti per giorno ---------- */
/* Il locale può avere fino a 2 fasce di apertura al giorno (Impostazioni → Orari di
   apertura al pubblico), per gestire gli orari spezzati (es. lun 8–16 e 19–23). La
   fascia 1 copre sempre mattina+pomeriggio (divisi dal "punto medio" di quella fascia,
   come da sempre); la fascia 2, se presente, è la fascia "sera". La cucina invece resta
   di default un turno unico continuo (comportamento storico), a meno che l'utente non
   attivi "la cucina segue le fasce" nelle impostazioni Cucina — in quel caso la cucina ha
   un proprio cuoco per la fascia 1 (pranzo) ed eventualmente uno per la fascia 2 (cena). */
/* ---------- calendario: stagioni e giorni speciali ----------
   Gli orari settimanali sono un modello che si ripete. Sopra ci stanno due livelli:
   una STAGIONE (un intervallo di date che ogni anno cambia gli orari — estate e inverno
   sul lago non sono la stessa cosa) e una DEROGA su una data precisa (Ferragosto, il 31
   dicembre, la sagra, una chiusura). Vince sempre il livello più specifico. */
function mmdd(dateStr){ return String(dateStr).slice(5,10); }
function dentroIntervalloAnnuale(dateStr, dal, al){
  if(!dal || !al) return false;
  var d = mmdd(dateStr);
  if(dal <= al) return d >= dal && d <= al;
  return d >= dal || d <= al; // intervallo che scavalca il capodanno
}
function stagioneAttiva(settings, dateStr){
  var st = settings.stagioni || [];
  for(var i=0;i<st.length;i++){
    if(st[i] && st[i].attiva!==false && dentroIntervalloAnnuale(dateStr, st[i].dal, st[i].al)) return st[i];
  }
  return null;
}
function derogaDelGiorno(settings, dateStr){
  return (settings.deroghe && settings.deroghe[dateStr]) || null;
}
/* La configurazione effettiva di un giorno: base settimanale → stagione → deroga. */
function configurazioneDelGiorno(settings, day, dateStr){
  var base = settings.orariGiorni[day] || {fascia1:{inizio:"08:00",fine:"21:00",puntoMedio:"14:30"}, fascia2:null};
  var out = {
    orari: base,
    priorita: (settings.prioritaFasce && settings.prioritaFasce[day]) || {mattina:3,pomeriggio:3,sera:3},
    salaNormale: settings.salaNormale,
    bancoNormale: settings.bancoNormale,
    chiuso: false,
    etichetta: null
  };
  if(!dateStr) return out;
  var stag = stagioneAttiva(settings, dateStr);
  if(stag){
    out.etichetta = stag.nome;
    if(stag.orariGiorni && stag.orariGiorni[day]) out.orari = stag.orariGiorni[day];
  }
  var der = derogaDelGiorno(settings, dateStr);
  if(der){
    out.etichetta = der.nome || "Giorno speciale";
    out.deroga = true;
    if(der.chiuso){ out.chiuso = true; return out; }
    if(der.orari) out.orari = der.orari;
    if(der.priorita) out.priorita = der.priorita;
    if(der.staff){
      if(der.staff.sala!==undefined && der.staff.sala!==null){ out.salaNormale = der.staff.sala; out.staffDeroga = true; }
      if(der.staff.banco!==undefined && der.staff.banco!==null){ out.bancoNormale = der.staff.banco; out.staffDeroga = true; }
    }
  }
  return out;
}

/* ---------- calendario italiano: giorni di affluenza prevedibile ----------
   Tutto quello che sta qui è calcolato in locale, senza chiamare nessun servizio
   esterno: le date fisse sono fisse, e quelle che dipendono dalla Pasqua si calcolano
   con l'algoritmo di Meeus/Jones/Butcher (calendario gregoriano, valido dal 1583).
   Le ricorrenze del singolo paese non si possono indovinare: si ricavano dal comune
   scelto in "La tua azienda" quando è un capoluogo di cui si conosce il patrono, e
   per il resto le aggiunge l'utente una volta sola (ricorrono poi ogni anno). */
function pasquaDi(anno){
  var a = anno % 19, b = Math.floor(anno/100), c = anno % 100;
  var d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  var g = Math.floor((b-f+1)/3), h = (19*a + b - d - g + 15) % 30;
  var i = Math.floor(c/4), k = c % 4;
  var l = (32 + 2*e + 2*i - h - k) % 7;
  var m = Math.floor((a + 11*h + 22*l)/451);
  var mese = Math.floor((h + l - 7*m + 114)/31);
  var giorno = ((h + l - 7*m + 114) % 31) + 1;
  return isoDate(new Date(anno, mese-1, giorno));
}
function nesimaDomenicaDi(anno, mese1based, n){
  var d = new Date(anno, mese1based-1, 1);
  var giorniAllaPrimaDomenica = (7 - d.getDay()) % 7;
  d.setDate(1 + giorniAllaPrimaDomenica + (n-1)*7);
  return isoDate(d);
}

/* Le ricorrenze che in un bar o in un ristorante si sentono davvero, al di là del
   fatto che siano festivi per legge. */
function suggerimentiCalendario(settings, anno){
  var out = [];
  var agg = function(data, nome, tipo, nota){
    if(!data) return;
    out.push({data:data, nome:nome, tipo:tipo, nota:nota||""});
  };
  // una data fissa entra solo se in quell'anno esiste davvero: "02-29" nel 2027 non
  // diventerebbe un errore, diventerebbe il 1º marzo — e sarebbe peggio
  var fissa = function(mmdd, nome, tipo, nota){
    var mese = Number(String(mmdd).slice(0,2)), giorno = Number(String(mmdd).slice(3,5));
    if(!giornoEsiste(anno, mese, giorno)) return;
    agg(anno+"-"+mmdd, nome, tipo, nota);
  };

  fissa("01-01","Capodanno","nazionale");
  fissa("01-06","Epifania","nazionale");
  fissa("02-14","San Valentino","commerciale","Cene di coppia: quasi sempre tutto pieno la sera.");
  fissa("03-08","Festa della donna","commerciale");
  fissa("03-19","Festa del papà","commerciale");
  fissa("04-25","Festa della Liberazione","nazionale");
  fissa("05-01","Festa dei lavoratori","nazionale");
  fissa("06-02","Festa della Repubblica","nazionale");
  fissa("08-15","Ferragosto","nazionale","Punta dell’anno per i locali turistici.");
  fissa("10-31","Halloween","commerciale");
  fissa("11-01","Ognissanti","nazionale");
  fissa("12-08","Immacolata","nazionale","Apre il periodo natalizio: ponte molto frequentato.");
  fissa("12-24","Vigilia di Natale","nazionale");
  fissa("12-25","Natale","nazionale");
  fissa("12-26","Santo Stefano","nazionale");
  fissa("12-31","San Silvestro","nazionale","Cenone: orari e organico fuori standard.");

  var pasqua = pasquaDi(anno);
  agg(addDays(pasqua,-47), "Martedì grasso (Carnevale)", "commerciale");
  agg(pasqua, "Pasqua", "nazionale");
  agg(addDays(pasqua,1), "Lunedì dell’Angelo (Pasquetta)", "nazionale", "Pranzi fuori e gite: giornata anomala.");
  agg(nesimaDomenicaDi(anno,5,2), "Festa della mamma", "commerciale", "Pranzo di domenica: il più affollato dell’anno per molti ristoranti.");

  var az = settings.azienda || {};
  var comune = String(az.comune||"").trim().toLowerCase();
  if(comune && PATRONI[comune]){
    fissa(PATRONI[comune][0], PATRONI[comune][1]+" — patrono di "+az.comune, "patrono",
          "Festa patronale: verifica la data con il comune, in alcuni casi si sposta alla domenica vicina.");
  }
  (az.eventiLocali||[]).forEach(function(e){
    fissa(e.mmdd, e.nome, "locale", "Ricorrenza che hai aggiunto tu: si ripropone ogni anno.");
  });
  out.sort(function(a,b){ return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; });
  return out;
}
/* Solo i suggerimenti che servono davvero: da oggi ai prossimi 12 mesi, escludendo
   le date già impostate a mano. */
function suggerimentiUtili(settings){
  var oggi = isoDate(new Date());
  var anno = Number(oggi.slice(0,4));
  var limite = isoDate(addDaysDate(new Date(), 366));
  // tre anni e non due: a fine dicembre la finestra dei 12 mesi arriva al gennaio
  // dell'anno dopo ancora, e senza questo il Capodanno sparirebbe proprio a dicembre
  var tutti = suggerimentiCalendario(settings, anno)
    .concat(suggerimentiCalendario(settings, anno+1))
    .concat(suggerimentiCalendario(settings, anno+2));
  var deroghe = settings.deroghe || {};
  var visti = {};
  return tutti.filter(function(s){
    if(s.data < oggi || s.data > limite) return false;
    if(deroghe[s.data]) return false;
    if(visti[s.data+"|"+s.nome]) return false;
    visti[s.data+"|"+s.nome] = true;
    return true;
  });
}
function addDaysDate(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }

function getSlotsForDay(settings, day, dateStr){
  var cfg = configurazioneDelGiorno(settings, day, dateStr);
  if(cfg.chiuso) return []; // locale chiuso: nessun turno da coprire
  var og = cfg.orari;
  var f1 = og.fascia1;
  var picco = !!settings.giorniPicco[day];
  // il rinforzo del giorno di picco vale finché non c'è una deroga che dice diversamente:
  // una data speciale è più specifica di una regola settimanale, e deve vincere
  var salaMattina = cfg.staffDeroga ? cfg.salaNormale : (picco ? settings.salaPicco : cfg.salaNormale);
  var bancoMattina = cfg.staffDeroga ? cfg.bancoNormale : (picco ? settings.bancoPicco : cfg.bancoNormale);
  var slots = [];
  if(!settings.cucinaSegueFasce){
    slots.push({key:"cuoco", label:"Cuoco", turno:"mattina", count:1, inizio:settings.cuocoInizio, fine:null, isCuoco:true});
  } else {
    var ocF1 = settings.orariCucina[day] && settings.orariCucina[day].fascia1;
    slots.push({key:"cuoco", label:"Cuoco · pranzo", turno:"mattina", count:1, inizio:(ocF1?ocF1.inizio:settings.cuocoInizio), fine:null, isCuoco:true});
  }
  slots.push({key:"banco_mattina", label:"Banco", turno:"mattina", count:bancoMattina, inizio:settings.bancoInizio, fine:f1.puntoMedio, ruolo:"banco"});
  slots.push({key:"sala_mattina", label:"Sala", turno:"mattina", count:salaMattina, inizio:settings.camerierArrivo, fine:f1.puntoMedio, ruolo:"sala"});
  // pomeriggio e sera seguono la stessa configurazione del giorno della mattina: se una
  // deroga dice "a Ferragosto in sala siamo in quattro", vale per tutta la giornata
  slots.push({key:"banco_pomeriggio", label:"Banco", turno:"pomeriggio", count:cfg.bancoNormale, inizio:f1.puntoMedio, fine:f1.fine, ruolo:"banco"});
  slots.push({key:"sala_pomeriggio", label:"Sala", turno:"pomeriggio", count:cfg.salaNormale, inizio:f1.puntoMedio, fine:f1.fine, ruolo:"sala"});
  if(og.fascia2){
    var f2 = og.fascia2;
    if(settings.cucinaSegueFasce && settings.orariCucina[day] && settings.orariCucina[day].fascia2){
      slots.push({key:"cuoco_sera", label:"Cuoco · cena", turno:"sera", count:1, inizio:settings.orariCucina[day].fascia2.inizio, fine:null, isCuoco:true});
    }
    slots.push({key:"banco_sera", label:"Banco", turno:"sera", count:cfg.bancoNormale, inizio:f2.inizio, fine:f2.fine, ruolo:"banco"});
    slots.push({key:"sala_sera", label:"Sala", turno:"sera", count:cfg.salaNormale, inizio:f2.inizio, fine:f2.fine, ruolo:"sala"});
  }
  return slots;
}
function computeSlotOrder(settings, weekStart){
  var order = ["cuoco","banco_mattina","sala_mattina","banco_pomeriggio","sala_pomeriggio"];
  var anyFascia2 = DAYS.some(function(d, i){
    var cfg = configurazioneDelGiorno(settings, d, weekStart ? addDays(weekStart, i) : null);
    return !cfg.chiuso && cfg.orari && cfg.orari.fascia2;
  });
  if(anyFascia2){
    if(settings.cucinaSegueFasce) order.splice(1,0,"cuoco_sera");
    order.push("banco_sera","sala_sera");
  }
  return order;
}
var SLOT_LABELS = {cuoco:"Cuoco",cuoco_sera:"Cuoco · cena",banco_mattina:"Banco · mattina",sala_mattina:"Sala · mattina",banco_pomeriggio:"Banco · pomeriggio",sala_pomeriggio:"Sala · pomeriggio",banco_sera:"Banco · sera",sala_sera:"Sala · sera"};

/* ---------- catalogo delle regole di tutela ----------
   Sono regole MORBIDE: il generatore le rispetta finché ha alternative, e quando
   l'unica persona disponibile le infrange copre lo stesso il turno e lo marca come
   irregolare. Nessun turno resta scoperto per colpa di una regola; nessuna
   irregolarità resta invisibile. Le regole DURE (ruolo, disponibilità, assenza, fine
   contratto, doppia presenza, monte ore contrattuale) restano invalicabili e vivono
   dentro eligible()/capacityOk(). */
var REGOLE_LABELS = {
  riposoGiornaliero: "Riposo tra due turni",
  riposoSettimanale: "Riposo settimanale",
  giorniConsecutivi: "Giorni consecutivi",
  tettoGiornaliero: "Ore massime al giorno"
};
function fmtOre(h){
  var m = Math.round(h*60), hh = Math.floor(m/60), mm = m%60;
  if(hh===0) return mm+" min";
  return mm ? (hh+"h "+mm+"m") : (hh+" ore");
}
function ms(iso){ return isoToDate(iso).getTime(); }

/* tutti gli intervalli già assegnati a un dipendente, raccolti da un blocco assign */
function raccogliIntervalli(assign, out){
  out = out || {};
  if(!assign) return out;
  DAYS.forEach(function(day){
    var g = assign[day];
    if(!g) return;
    Object.keys(g).forEach(function(key){
      var v = g[key];
      if(!v) return;
      if(key==="cuoco" || key==="cuocoSera"){
        if(v.empId && v.inizio && v.fine) (out[v.empId] = out[v.empId]||[]).push({inizio:v.inizio, fine:v.fine, ref:v});
        return;
      }
      if(!Array.isArray(v)) return;
      v.forEach(function(a){
        if(a && a.empId && a.inizio && a.fine) (out[a.empId] = out[a.empId]||[]).push({inizio:a.inizio, fine:a.fine, ref:a});
      });
    });
  });
  return out;
}
/* intervalli delle settimane adiacenti: servono perché il riposo e i giorni
   consecutivi non si fermano al confine tra una settimana e l'altra */
function intervalliAdiacenti(weekStart){
  var out = {};
  [addDays(weekStart,-7), addDays(weekStart,7)].forEach(function(w){
    var wk = state.weeks && state.weeks[w];
    if(wk && wk.assign) raccogliIntervalli(wk.assign, out);
  });
  return out;
}

/* valuta le regole morbide per un candidato turno. Ritorna l'elenco delle violazioni,
   ciascuna con la sua entità (per poter scegliere chi viola di meno). */
function violazioniTutela(settings, intervalli, cand, weekStart){
  var out = [];
  var rt = settings.regoleTutela || {};
  var altri = (intervalli||[]).filter(function(iv){ return iv.ref !== cand.ref; });

  if(rt.riposoGiornaliero && rt.riposoGiornaliero.attiva){
    var oreMin = Number(rt.riposoGiornaliero.ore)||11;
    var gapMin = null;
    altri.forEach(function(iv){
      var g = null;
      if(ms(iv.fine) <= ms(cand.inizio)) g = (ms(cand.inizio) - ms(iv.fine))/60000;
      else if(ms(iv.inizio) >= ms(cand.fine)) g = (ms(iv.inizio) - ms(cand.fine))/60000;
      if(g===null) return;
      if(gapMin===null || g < gapMin) gapMin = g;
    });
    if(gapMin!==null && gapMin < oreMin*60 - 0.001){
      out.push({regola:"riposoGiornaliero", entita:(oreMin*60-gapMin)/60,
        testo:"riposo di "+fmtOre(gapMin/60)+" tra due turni invece di "+oreMin});
    }
  }

  if(rt.riposoSettimanale && rt.riposoSettimanale.attiva){
    var oreSett = Number(rt.riposoSettimanale.ore)||24;
    var da = ms(isoAt(weekStart,"00:00")), a = ms(isoAt(addDays(weekStart,7),"00:00"));
    var dentro = altri.concat([cand]).map(function(iv){
      return {a: Math.max(ms(iv.inizio), da), b: Math.min(ms(iv.fine), a)};
    }).filter(function(iv){ return iv.b > iv.a; }).sort(function(x,y){ return x.a - y.a; });
    var cursore = da, maxGap = 0;
    dentro.forEach(function(iv){
      if(iv.a > cursore) maxGap = Math.max(maxGap, (iv.a - cursore)/60000);
      cursore = Math.max(cursore, iv.b);
    });
    maxGap = Math.max(maxGap, (a - cursore)/60000);
    if(maxGap < oreSett*60 - 0.001){
      out.push({regola:"riposoSettimanale", entita:(oreSett*60-maxGap)/60,
        testo:"nessuna pausa di "+oreSett+" ore di fila nella settimana (la più lunga è "+fmtOre(maxGap/60)+")"});
    }
  }

  if(rt.giorniConsecutivi && rt.giorniConsecutivi.attiva){
    var maxGg = Number(rt.giorniConsecutivi.max)||6;
    var giorni = {};
    altri.forEach(function(iv){ giorni[isoDay(iv.inizio)] = true; });
    var giornoCand = isoDay(cand.inizio);
    giorni[giornoCand] = true;
    var run = 1, d;
    d = addDays(giornoCand,-1); while(giorni[d]){ run++; d = addDays(d,-1); }
    d = addDays(giornoCand,1);  while(giorni[d]){ run++; d = addDays(d,1); }
    if(run > maxGg){
      out.push({regola:"giorniConsecutivi", entita:run-maxGg,
        testo:run+" giorni consecutivi di lavoro (il massimo è "+maxGg+")"});
    }
  }

  var maxGiorno = Number(settings.oreGiornaliereMax)||10;
  var totGiorno = (cand.oreGiorno||0) + (cand.durata||0);
  if(totGiorno > maxGiorno + 0.001){
    out.push({regola:"tettoGiornaliero", entita:totGiorno-maxGiorno,
      testo:"giornata di "+fmtOre(totGiorno)+" oltre il massimo di "+maxGiorno+" ore"});
  }
  return out;
}
function pesoViolazioni(v){ return (v||[]).reduce(function(s,x){ return s + (Number(x.entita)||0); }, 0); }
function testoViolazioni(v){ return (v||[]).map(function(x){ return x.testo; }).join(" · "); }

/* ---------- priorità per fascia (mattina/pomeriggio/sera): utilità ---------- */
function bandeOfDay(settings, day, dateStr){
  var cfg = configurazioneDelGiorno(settings, day, dateStr);
  if(cfg.chiuso) return [];
  var b = ["mattina","pomeriggio"];
  if(cfg.orari && cfg.orari.fascia2) b.push("sera");
  return b;
}
function tierOf(settings, day, banda, dateStr){
  var cfg = configurazioneDelGiorno(settings, day, dateStr);
  var t = cfg.priorita && cfg.priorita[banda];
  return (t===1||t===2||t===3) ? t : 3;
}
function cucinaOrari(settings, day, fascia){
  if(!settings.cucinaSegueFasce){
    // comportamento storico: un solo turno cuoco continuo, orari globali, indipendente dalla fascia
    if(fascia==="fascia2") return null;
    return {inizio:settings.cuocoInizio, fineCapo:settings.fineTurnoCuocoCapo, fineRiserva:settings.fineTurnoCuocoRiserva};
  }
  var oc = settings.orariCucina[day] && settings.orariCucina[day][fascia];
  if(!oc) return null;
  return {inizio:oc.inizio, fineCapo:oc.fineCapo, fineRiserva:oc.fineRiserva};
}

/* ---------- generazione automatica ---------- */
/* Ordine di priorità quando il personale non basta a coprire tutto: ogni giorno e
   ogni fascia (mattina/pomeriggio/sera) ha un proprio livello di priorità 1/2/3,
   personalizzabile in Impostazioni → Priorità; si coprono prima tutte le celle di
   priorità 1, poi quelle di priorità 2, poi il resto. Dentro ogni livello, i reparti
   (cucina/banco/sala) vengono coperti nell'ordine scelto dal cliente (di default:
   cucina, poi banco, poi sala). La cucina non ha bande proprie: la fascia 1 (pranzo)
   viene protetta al livello più urgente tra mattina e pomeriggio di quel giorno; la
   fascia 2 (cena), se il locale la offre e la cucina la segue, usa il livello della
   fascia "sera". Nei giorni/fasce di priorità 3 il reparto con priorità più bassa
   nell'ordine scelto è quello che si accetta di lasciare scoperto per primo. */
function buildTaskQueue(settings, weekStart){
  var order = normalizePriorityOrder(settings.ordinePriorita);
  var byTier = {1:[], 2:[], 3:[]};
  DAYS.forEach(function(day, idx){
    var dataGiorno = weekStart ? addDays(weekStart, idx) : null;
    var bande = bandeOfDay(settings, day, dataGiorno);
    if(!bande.length) return; // giorno di chiusura: niente da coprire
    bande.forEach(function(banda){
      byTier[tierOf(settings, day, banda, dataGiorno)].push({day:day, banda:banda, kind:"foh", data:dataGiorno});
    });
    var tierFascia1 = Math.min(tierOf(settings, day, "mattina", dataGiorno), tierOf(settings, day, "pomeriggio", dataGiorno));
    byTier[tierFascia1].push({day:day, kind:"cucina", fascia:"fascia1", data:dataGiorno});
    if(bande.indexOf("sera")!==-1){
      byTier[tierOf(settings, day, "sera", dataGiorno)].push({day:day, kind:"cucina", fascia:"fascia2", data:dataGiorno});
    }
  });
  var tierDefs = [
    {cells: byTier[1], livello:"critico"},
    {cells: byTier[2], livello:"attenzione"},
    {cells: byTier[3], livello:"attenzione"}
  ];
  var tasks = [];
  tierDefs.forEach(function(tier, tierIdx){
    order.forEach(function(dept, deptIdx){
      // nei giorni/fasce ordinari, il reparto con priorità più bassa (ultimo nell'ordine
      // scelto) è quello che si accetta di lasciare scoperto per primo
      var livelloBase = tier.livello;
      tier.cells.forEach(function(cell){
        var livello = (tierIdx===2 && deptIdx===order.length-1) ? "accettato" : livelloBase;
        if(dept==="cucina"){
          if(cell.kind!=="cucina") return;
          if(cell.fascia==="fascia2" && !settings.cucinaSegueFasce) return;
          var orari = cucinaOrari(settings, cell.day, cell.fascia);
          if(!orari) return; // fascia non configurata per questo giorno: nessun task, nessun buco segnalato
          tasks.push({type:"cucina", day:cell.day, fascia:cell.fascia, orari:orari, livelloGap:livello});
        } else {
          if(cell.kind!=="foh") return;
          getSlotsForDay(settings, cell.day, cell.data).filter(function(s){ return !s.isCuoco && s.ruolo===dept && s.turno===cell.banda; }).forEach(function(s){
            tasks.push({type:"foh", day:cell.day, slot:s, livelloGap:livello});
          });
        }
      });
    });
  });
  return tasks;
}

/* ---------- identità delle assegnazioni e storico ----------
   Ogni assegnazione diventa una riga con una sua identità: id, origine (automatica o
   manuale), quando è nata e quando è stata toccata l'ultima volta. Dentro il blob di
   oggi cambia poco; il giorno in cui i turni finiranno su tabelle vere, la migrazione
   sarà meccanica. Lo storico della settimana rende dimostrabile chi ha cambiato cosa. */
function timbra(rec, origine){
  if(!rec.id) rec.id = "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  var ora = new Date().toISOString();
  if(!rec.creatoIl) rec.creatoIl = ora;
  rec.modificatoIl = ora;
  rec.origine = origine || rec.origine || "auto";
  return rec;
}
function registraStorico(wk, tipo, testo){
  if(!wk.storico) wk.storico = [];
  wk.storico.push({quando:new Date().toISOString(), tipo:tipo, testo:testo});
  // lo storico serve a ricostruire cosa è successo, non a crescere all'infinito
  if(wk.storico.length > 200) wk.storico = wk.storico.slice(-200);
  if(wk.stato==="pubblicato" && tipo!=="pubblicazione"){
    wk.modificheDopoPubblicazione = (wk.modificheDopoPubblicazione||0) + 1;
  }
}
function statoSettimana(wk){
  if(!wk) return "vuota";
  return wk.stato || "bozza";
}

/* ---------- pianificato e consuntivo ----------
   Il piano dice cosa era previsto, il consuntivo cosa è stato davvero lavorato. Sono due
   cose diverse e finora ne esisteva una sola: gli straordinari si pareggiavano su ore
   mai verificate. Ogni assegnazione può portare un `consuntivo {inizio, fine, quando}`;
   finché non c'è, vale il pianificato — così niente cambia per chi non lo usa. */
function oreDiAssegnazione(a){
  if(!a || !a.inizio || !a.fine) return 0;
  if(a.consuntivo && a.consuntivo.inizio && a.consuntivo.fine) return durH(a.consuntivo.inizio, a.consuntivo.fine);
  return durH(a.inizio, a.fine);
}
function forEachAssegnazione(wk, fn){
  if(!wk || !wk.assign) return;
  DAYS.forEach(function(day){
    var g = wk.assign[day];
    if(!g) return;
    Object.keys(g).forEach(function(key){
      var v = g[key];
      if(!v) return;
      if(key==="cuoco" || key==="cuocoSera"){ if(v.empId) fn(v, day, key, 0); return; }
      if(Array.isArray(v)) v.forEach(function(a, i){ if(a && a.empId) fn(a, day, key, i); });
    });
  });
}
function oreDellaSettimana(wk, empId){
  var tot = 0;
  forEachAssegnazione(wk, function(a){ if(a.empId===empId) tot += oreDiAssegnazione(a); });
  return Math.round(tot*100)/100;
}
function orePianificateSettimana(wk, empId){
  var tot = 0;
  forEachAssegnazione(wk, function(a){ if(a.empId===empId && a.inizio && a.fine) tot += durH(a.inizio, a.fine); });
  return Math.round(tot*100)/100;
}
function statoConsuntivo(wk){
  var totali = 0, confermate = 0;
  forEachAssegnazione(wk, function(a){ totali++; if(a.consuntivo) confermate++; });
  return {totali:totali, confermate:confermate, completo: totali>0 && confermate===totali};
}

/* ---------- monte ore proporzionale alle assenze ----------
   Chi è stato in ferie o in malattia non deve "recuperare" ore che la legge considera
   già coperte, e non deve comparire come sotto contratto. La quota giornaliera esce
   dal contratto (ore settimanali diviso i giorni lavorativi), il ROL toglie le sue ore
   esatte. */
function quotaGiornaliera(emp){
  var gg = Number(emp.giorniLavorativi)||0;
  if(gg<=0) gg = 5;
  return (Number(emp.oreContratto)||0) / gg;
}
function assenzeDellaSettimana(emp, weekStart){
  var giorniInteri = 0, oreRol = 0;
  var assenze = emp.assenze || {};
  for(var i=0;i<7;i++){
    var rec = assenze[addDays(weekStart, i)];
    if(!rec) continue;
    if(rec.tipo==="ferie" || rec.tipo==="malattia") giorniInteri++;
    else if(rec.tipo==="rol") oreRol += Number(rec.ore)||0;
  }
  return {giorniInteri:giorniInteri, oreRol:oreRol};
}
function obiettivoSettimanale(emp, weekStart){
  var base = Number(emp.oreContratto)||0;
  if(!weekStart) return base;
  var a = assenzeDellaSettimana(emp, weekStart);
  var ridotto = base - a.giorniInteri*quotaGiornaliera(emp) - a.oreRol;
  return Math.max(0, Math.round(ridotto*100)/100);
}

/* ore di straordinario accumulate da ciascun dipendente nelle N settimane precedenti a weekStart
   (media mobile usata per il pareggiamento: vedi impostazioni "Pareggiamento straordinari") */
function rollingOvertimeMap(weekStart){
  var settings = state.settings;
  var map = {};
  if(!settings.paritaStraordinariEnabled) return map;
  var n = Math.max(1, Number(settings.paritaStraordinariFinestra)||4);
  for(var i=1;i<=n;i++){
    var wStart = addDays(weekStart, -7*i);
    var wk = state.weeks[wStart];
    if(!wk || !wk.hoursWorked) continue;
    state.employees.forEach(function(e){
      // ore davvero lavorate quando il consuntivo è stato confermato, altrimenti il piano;
      // e obiettivo di QUELLA settimana, ridotto dalle assenze di quella settimana
      var h = oreDellaSettimana(wk, e.id);
      var target = obiettivoSettimanale(e, wStart);
      var ot = Math.max(0, h-target);
      map[e.id] = (map[e.id]||0) + ot;
    });
  }
  return map;
}

function generateSchedule(weekStart){
  var settings = state.settings;
  var employees = state.employees;
  var wk = state.weeks[weekStart] || {weekStart:weekStart};

  var hoursWorked = {}, turnoTaken = {}, dailyWorked = {}; // turnoTaken["empId|day_turno"]=true, dailyWorked["empId|day"]=ore
  employees.forEach(function(e){ hoursWorked[e.id]=0; });
  // intervalli già impegnati da ciascuno: partono dalle settimane adiacenti (il riposo
  // non si ferma al confine della settimana) e crescono man mano che si assegna
  var intervalli = intervalliAdiacenti(weekStart);
  function intervalliDi(empId){ return intervalli[empId] || []; }
  function registraIntervallo(empId, inizio, fine, ref){
    (intervalli[empId] = intervalli[empId] || []).push({inizio:inizio, fine:fine, ref:ref});
  }

  var assign = {}, gaps = [];
  DAYS.forEach(function(day){ assign[day] = {}; });

  function dayHours(id, day){ return dailyWorked[id+"|"+day]||0; }
  function addDayHours(id, day, h){ dailyWorked[id+"|"+day] = dayHours(id,day)+h; }
  function eligible(e, turno, day, ruoloOk){
    var dateStr = addDays(weekStart, DAYS.indexOf(day));
    if(e.fineContrattoDal && dateStr >= e.fineContrattoDal) return false; // contratto terminato da quella data: mai più in turno
    if(e.assenze && e.assenze[dateStr]) return false; // ferie/malattia/ROL quel giorno: escluso dalla generazione automatica
    if(!ruoloOk(e)) return false;
    var disp = e.disponibilita && e.disponibilita[day];
    if(!disp || !disp[turno]) return false;
    // se è già in turno in un'altra fascia (mattina/pomeriggio/sera) quello stesso
    // giorno, serve "spezzatiOk" per aggiungerne un'altra (vale anche mattina+sera
    // o pomeriggio+sera, non solo mattina+pomeriggio)
    var hasOtherTurno = BANDE.some(function(b){ return b!==turno && turnoTaken[e.id+"|"+day+"_"+b]; });
    if(hasOtherTurno && !e.spezzatiOk) return false;
    if(turnoTaken[e.id+"|"+day+"_"+turno]) return false;
    return true;
  }
  // obiettivo di questa settimana per ciascuno, già ridotto dalle assenze
  var obiettivo = {};
  employees.forEach(function(e){ obiettivo[e.id] = obiettivoSettimanale(e, weekStart); });
  function capacityOk(e, hours){
    var max = obiettivo[e.id] + (Number(e.straordinario)||0);
    if(e.tipoContratto==="chiamata" && (Number(e.oreContratto)||0)+(Number(e.straordinario)||0)<=0) return true; // nessun tetto impostato: nessun limite
    return hoursWorked[e.id] + hours <= max + 0.001;
  }
  function score(e){
    var target = obiettivo[e.id] || 1;
    return hoursWorked[e.id]/target;
  }
  var rollingOT = rollingOvertimeMap(weekStart);
  function overtimePenalty(e, dur){
    if(!settings.paritaStraordinariEnabled) return 0;
    var wouldBeOvertime = (hoursWorked[e.id]||0) + (dur||0) > obiettivo[e.id] + 0.01;
    if(!wouldBeOvertime) return 0;
    return rollingOT[e.id]||0;
  }
  /* per ogni candidato: quali regole morbide infrangerebbe questo turno */
  function valutaViolazioni(candidates, day, inizioIso, fineIso, dur){
    var map = {};
    candidates.forEach(function(e){
      map[e.id] = violazioniTutela(settings, intervalliDi(e.id),
        {inizio:inizioIso, fine:fineIso, oreGiorno:dayHours(e.id, day), durata:dur}, weekStart);
    });
    return map;
  }
  /* La scala delle rinunce: si scende di un gradino solo quando quello sopra è vuoto.
     1) chi non viola niente  2) chi entra in straordinario entro tolleranza
     3) chi viola una regola morbida, minimizzando l'entità  4) chi ne viola più d'una */
  function pick(candidates, turno, dur, violMap){
    if(!candidates.length) return null;
    candidates.sort(function(a,b){
      var va = (violMap && violMap[a.id]) || [], vb = (violMap && violMap[b.id]) || [];
      if(va.length !== vb.length) return va.length - vb.length;
      var wa = pesoViolazioni(va), wb = pesoViolazioni(vb);
      if(Math.abs(wa-wb) > 0.001) return wa - wb;
      var pa = (a.turnoPreferito===turno?0:(a.turnoPreferito==="indifferente"?1:2)) + (a.tipoContratto==="chiamata"?10:0);
      var pb = (b.turnoPreferito===turno?0:(b.turnoPreferito==="indifferente"?1:2)) + (b.tipoContratto==="chiamata"?10:0);
      if(pa!==pb) return pa-pb;
      var oa = overtimePenalty(a, dur), ob = overtimePenalty(b, dur);
      if(oa!==ob) return oa-ob;
      return score(a)-score(b);
    });
    return candidates[0];
  }
  /* quando un turno resta scoperto: perché. Si guarda la prima regola DURA che ha
     escluso ciascuno, e chi ci è andato più vicino sul monte ore. */
  function diagnosiBuco(ruoloOk, turno, day, dur){
    var motivi = {}, vicino = null, vicinoDelta = Infinity, conRuolo = 0;
    var dateStr = addDays(weekStart, DAYS.indexOf(day));
    employees.forEach(function(e){
      if(!ruoloOk(e)) return;
      conRuolo++;
      if(e.fineContrattoDal && dateStr >= e.fineContrattoDal){ motivi.contratto=(motivi.contratto||0)+1; return; }
      if(e.assenze && e.assenze[dateStr]){ motivi.assenza=(motivi.assenza||0)+1; return; }
      var disp = e.disponibilita && e.disponibilita[day];
      if(!disp || !disp[turno]){ motivi.disponibilita=(motivi.disponibilita||0)+1; return; }
      if(turnoTaken[e.id+"|"+day+"_"+turno]){ motivi.giaInTurno=(motivi.giaInTurno||0)+1; return; }
      var altroTurno = BANDE.some(function(b){ return b!==turno && turnoTaken[e.id+"|"+day+"_"+b]; });
      if(altroTurno && !e.spezzatiOk){ motivi.spezzati=(motivi.spezzati||0)+1; return; }
      var max = (Number(e.oreContratto)||0) + (Number(e.straordinario)||0);
      if(e.tipoContratto==="chiamata" && max<=0) return;
      var delta = (hoursWorked[e.id]||0) + dur - max;
      if(delta > 0.001){
        motivi.monteOre=(motivi.monteOre||0)+1;
        if(delta < vicinoDelta){ vicinoDelta = delta; vicino = e; }
      }
    });
    if(!conRuolo) return "nessun dipendente copre questo ruolo";
    if(motivi.monteOre && vicino) return "tutti oltre il monte ore tollerato — il più vicino è "+vicino.nome+", gli mancano "+fmtOre(vicinoDelta)+" di margine";
    if(motivi.assenza) return "chi copre il ruolo è assente quel giorno";
    if(motivi.disponibilita) return "nessuno del ruolo si è dichiarato disponibile in questa fascia";
    if(motivi.giaInTurno || motivi.spezzati) return "chi poteva coprirlo è già in turno quel giorno";
    if(motivi.contratto) return "i contratti di chi copre il ruolo sono già terminati";
    return "nessun candidato idoneo";
  }

  // cucina + banco/sala: un'unica coda di assegnazione, ordinata per giorni di
  // priorità (1, poi 2, poi resto della settimana) e, dentro ogni livello, per
  // l'ordine dei reparti scelto in Impostazioni → Priorità
  buildTaskQueue(settings, weekStart).forEach(function(task){
    var day = task.day;
    var dataGiorno = addDays(weekStart, DAYS.indexOf(day)); // qui il modello orario diventa un istante
    if(task.type==="cucina"){
      var orari = task.orari;
      var turnoKey = task.fascia==="fascia2" ? "sera" : "mattina";
      var assignField = task.fascia==="fascia2" ? "cuocoSera" : "cuoco";
      var inizioIso = isoAt(dataGiorno, orari.inizio);
      var fineCapoIso = isoFine(dataGiorno, orari.inizio, orari.fineCapo);
      var fineRisIso = isoFine(dataGiorno, orari.inizio, orari.fineRiserva);
      var durCapo = durH(inizioIso, fineCapoIso);
      var durRis = durH(inizioIso, fineRisIso);
      var ruoloCapo = function(x){ return x.ruoli.cuoco_capo; };
      var ruoloRis = function(x){ return x.ruoli.cuoco_riserva; };
      var capoCands = employees.filter(function(e){ return eligible(e,turnoKey,day,ruoloCapo) && capacityOk(e, durCapo); });
      var violCapo = valutaViolazioni(capoCands, day, inizioIso, fineCapoIso, durCapo);
      var chosen = pick(capoCands,turnoKey,durCapo,violCapo), tipo = "capo", viol = chosen ? violCapo[chosen.id] : [];
      if(!chosen){
        var risCands = employees.filter(function(e){ return eligible(e,turnoKey,day,ruoloRis) && capacityOk(e, durRis); });
        var violRis = valutaViolazioni(risCands, day, inizioIso, fineRisIso, durRis);
        chosen = pick(risCands,turnoKey,durRis,violRis); tipo = "riserva";
        viol = chosen ? violRis[chosen.id] : [];
      }
      if(chosen){
        var fineIso = tipo==="capo" ? fineCapoIso : fineRisIso;
        var chiusuraCucina = addMinIso(fineIso, -settings.minutiCucinaPrimaFineTurno);
        var durCuoco = durH(inizioIso, fineIso);
        hoursWorked[chosen.id] += durCuoco;
        addDayHours(chosen.id, day, durCuoco);
        turnoTaken[chosen.id+"|"+day+"_"+turnoKey] = true;
        var rec = timbra({empId:chosen.id, tipo:tipo, inizio:inizioIso, fine:fineIso, chiusuraCucina:chiusuraCucina}, "auto");
        if(viol && viol.length) rec.violazioni = viol;
        assign[day][assignField] = rec;
        registraIntervallo(chosen.id, inizioIso, fineIso, rec);
      } else {
        assign[day][assignField] = null;
        gaps.push({day:day, key:assignField, livello:task.livelloGap,
          msg:(task.fascia==="fascia2"?"Nessun cuoco (cena) disponibile — ":"Nessun cuoco disponibile — ")+DAY_LABELS[day],
          perche: diagnosiBuco(function(x){ return x.ruoli.cuoco_capo||x.ruoli.cuoco_riserva; }, turnoKey, day, durCapo)});
      }
    } else {
      var slot = task.slot;
      var slotInizio = isoAt(dataGiorno, slot.inizio);
      var slotFine = isoFine(dataGiorno, slot.inizio, slot.fine);
      var dur = durH(slotInizio, slotFine);
      var ruoloSlot = function(x){ return !!x.ruoli[slot.ruolo]; };
      var picked = [];
      for(var i=0;i<slot.count;i++){
        var cands = employees.filter(function(e){
          if(picked.indexOf(e.id)!==-1) return false;
          return eligible(e, slot.turno, day, ruoloSlot) && capacityOk(e, dur);
        });
        var violSlot = valutaViolazioni(cands, day, slotInizio, slotFine, dur);
        var ch = pick(cands, slot.turno, dur, violSlot);
        if(ch){
          picked.push({id:ch.id, viol:violSlot[ch.id]});
          hoursWorked[ch.id] += dur;
          addDayHours(ch.id, day, dur);
          turnoTaken[ch.id+"|"+day+"_"+slot.turno] = true;
        } else {
          var turnoLabel = slot.turno==="mattina"?"mattina":(slot.turno==="pomeriggio"?"pomeriggio":"sera");
          gaps.push({day:day, key:slot.key, livello:task.livelloGap,
            msg:"Manca "+slot.label.toLowerCase()+" · "+turnoLabel+" — "+DAY_LABELS[day],
            perche: diagnosiBuco(ruoloSlot, slot.turno, day, dur)});
        }
      }
      assign[day][slot.key] = picked.map(function(p){
        var rec = timbra({empId:p.id, inizio:slotInizio, fine:slotFine}, "auto");
        if(p.viol && p.viol.length) rec.violazioni = p.viol;
        registraIntervallo(p.id, slotInizio, slotFine, rec);
        return rec;
      });
    }
  });

  // 3) chi non raggiunge le ore di contratto: allunga uno dei suoi turni all'indietro,
  //    accavallandolo con quello precedente, finché non arriva alle ore stabilite (o non c'è più margine)
  /* Per ogni turno allungabile: fin dove si può arretrare l'inizio ("earliest", orario
     del giorno), in quale fascia serve essere disponibili, e quale fascia non deve già
     essere occupata dalla stessa persona (per non sovrapporsi a un proprio altro turno). */
  function extensionSpec(key, day){
    var og = settings.orariGiorni[day];
    if(key==="banco_pomeriggio") return {earliest:settings.bancoInizio, richiede:"mattina", occupata:"mattina"};
    if(key==="sala_pomeriggio") return {earliest:settings.camerierArrivo, richiede:"mattina", occupata:"mattina"};
    if(key==="sala_mattina") return {earliest:settings.bancoInizio, richiede:"mattina", occupata:null};
    if((key==="banco_sera" || key==="sala_sera") && og && og.fascia1){
      // il turno serale si accavalla al pomeriggio, non alla mattina
      return {earliest:og.fascia1.puntoMedio, richiede:"pomeriggio", occupata:"pomeriggio"};
    }
    return null; // banco_mattina è già il turno più presto della giornata: niente da accavallare prima
  }
  var ESTENDIBILI = ["banco_pomeriggio","sala_pomeriggio","banco_sera","sala_sera","sala_mattina"];
  employees.forEach(function(emp){
    if(emp.tipoContratto==="chiamata") return;
    // obiettivo già ridotto dalle assenze: chi è stato in ferie o in malattia non deve
    // "recuperare" ore allungando i turni dei giorni in cui c'era
    var target = obiettivo[emp.id];
    if(target<=0) return;
    var deficit = target - (hoursWorked[emp.id]||0);
    if(deficit<=0.01) return;

    var mySlots = [];
    DAYS.forEach(function(day){
      ESTENDIBILI.forEach(function(key){
        (assign[day][key]||[]).forEach(function(a){
          if(a.empId===emp.id) mySlots.push({day:day, key:key, entry:a});
        });
      });
    });
    // priorità: prima i turni che hanno più margine per accavallarsi a quello precedente
    mySlots.sort(function(x,y){
      var rank = function(k){ return k.indexOf("pomeriggio")!==-1 ? 0 : (k.indexOf("sera")!==-1 ? 1 : 2); };
      return rank(x.key)-rank(y.key);
    });

    mySlots.forEach(function(ref){
      if(deficit<=0.01) return;
      var spec = extensionSpec(ref.key, ref.day);
      if(!spec) return;
      var disp = emp.disponibilita && emp.disponibilita[ref.day];
      if(!disp || !disp[spec.richiede]) return;
      if(spec.occupata && turnoTaken[emp.id+"|"+ref.day+"_"+spec.occupata]) return;
      var current = ref.entry.inizio;
      var earliestIso = isoAt(isoDay(current), spec.earliest);
      var maxBackMin = minutiTra(earliestIso, current);
      if(maxBackMin<=0) return;
      var neededMin = Math.round(deficit*60);
      // non superare mai il massimo di ore giornaliere (default 10h) per questa persona in questo giorno
      var dailyRemainMin = Math.round(((Number(settings.oreGiornaliereMax)||10) - dayHours(emp.id, ref.day)) * 60);
      var applyMin = Math.min(maxBackMin, neededMin, Math.max(0,dailyRemainMin));
      applyMin = Math.floor(applyMin/15)*15; // arrotonda a quarti d'ora
      if(applyMin<=0) return;
      ref.entry.inizio = addMinIso(current, -applyMin);
      var addedHours = applyMin/60;
      hoursWorked[emp.id] += addedHours;
      addDayHours(emp.id, ref.day, addedHours);
      deficit -= addedHours;
    });
  });

  var eraPubblicata = wk.stato==="pubblicato";
  wk.assign = assign;
  wk.gaps = gaps;
  wk.generatedAt = new Date().toISOString();
  // rigenerare azzera il consuntivo perché i turni non sono più quelli confermati:
  // la settimana torna in bozza e va ripubblicata
  wk.stato = "bozza";
  delete wk.pubblicatoIl;
  wk.modificheDopoPubblicazione = 0;
  state.weeks[weekStart] = wk;
  recomputeHours(wk);
  registraStorico(wk, "generazione", eraPubblicata
    ? "Turni rigenerati: la settimana era pubblicata ed è tornata in bozza"
    : "Turni generati automaticamente");
  saveState();
}

/* Tabella oraria di una stagione: gli stessi campi degli orari standard, ma scritti
   qui dentro, così si vede a colpo d'occhio cosa cambia davvero d'estate o d'inverno.

function renderTabellaOrariStagione(orari, i){
  var testa = '<div style="display:flex;gap:10px;align-items:center;padding:6px 0;font-size:.72rem;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap;">'+

    '<div>Seconda apertura</div></div>';
