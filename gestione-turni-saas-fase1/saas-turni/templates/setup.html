<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crea azienda — Gestione turni</title>
<style>
  :root{--ink:#1c1f26;--ink-muted:#6b7280;--surface:#ffffff;--surface-2:#f4f5f7;--accent:#2d6a4f;--danger:#b3261e;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);}
  .card{background:var(--surface);padding:32px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%;max-width:360px;}
  h1{font-size:1.2rem;margin:0 0 4px;}
  p.sub{color:var(--ink-muted);font-size:.88rem;margin:0 0 20px;}
  label{display:block;font-size:.85rem;margin:14px 0 4px;color:var(--ink-muted);}
  input{width:100%;padding:10px 12px;border:1px solid #d8dadf;border-radius:8px;font-size:.95rem;}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{width:100%;margin-top:20px;padding:11px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;}
  button:hover{opacity:.92;}
  .error{margin-top:14px;padding:10px 12px;border-radius:8px;background:#fdecea;color:var(--danger);font-size:.85rem;}
  .ok{margin-top:14px;padding:10px 12px;border-radius:8px;background:#e7f5ec;color:var(--accent);font-size:.85rem;}
</style>
</head>
<body>
  <div class="card">
    <h1>Nuova azienda</h1>
    <p class="sub">Crea l'account di accesso per un'attività cliente.</p>
    {% if ok_message %}
      <div class="ok">{{ ok_message }}</div>
    {% else %}
      <form method="post">
        <label for="nome">Nome attività</label>
        <input type="text" id="nome" name="nome" required autofocus>
        <label for="email">Email di accesso</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
        <button type="submit">Crea account</button>
      </form>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% endif %}
  </div>
</body>
</html>
